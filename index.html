<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario de Oficina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cliente oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Credenciales de Supabase
        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co'; // <--- Asegúrate de poner tu Project URL real aquí
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState('');
            
            const [formData, setFormData] = useState({
                sku: '',
                categoria: '',
                producto: '',
                cantidad: '',
                personal_asignado: '',
                estado_stock: 'Stock Adecuado',
                observaciones: ''
            });

            const fetchRecords = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('productos')
                        .select('*')
                        .order('id', { ascending: false });

                    if (error) {
                        setErrorMsg(error.message);
                    } else {
                        setProductos(data || []);
                        setErrorMsg('');
                    }
                } catch (error) {
                    console.error('Error al cargar inventario:', error);
                    setErrorMsg('Error de conexión con Supabase');
                }
                setLoading(false);
            };

            useEffect(() => {
                if (SUPABASE_URL !== 'https://tu-proyecto.supabase.co') {
                    fetchRecords();
                } else {
                    setLoading(false);
                    setErrorMsg('Por favor coloca tu Project URL real de Supabase en la línea 21 del código.');
                }
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('productos').insert([{
                        sku: formData.sku,
                        categoria: formData.categoria,
                        producto: formData.producto,
                        cantidad: Number(formData.cantidad),
                        personal_asignado: formData.personal_asignado,
                        estado_stock: formData.estado_stock,
                        observaciones: formData.observaciones
                    }]);

                    if (!error) {
                        setFormData({ sku: '', categoria: '', producto: '', cantidad: '', personal_asignado: '', estado_stock: 'Stock Adecuado', observaciones: '' });
                        fetchRecords();
                        alert('¡Guardado con éxito en Supabase!');
                    } else {
                        alert('Error al guardar: ' + error.message);
                    }
                } catch (error) {
                    console.error('Error de red:', error);
                }
            };

            const handleDelete = async (id) => {
                if (!window.confirm('¿Seguro que deseas eliminar este elemento?')) return;
                try {
                    const { error } = await supabase.from('productos').delete().eq('id', id);
                    if (!error) fetchRecords();
                } catch (error) {
                    console.error('Error al eliminar:', error);
                }
            };

            const handleUpdateField = async (id, fieldName, value) => {
                try {
                    const updateObj = {};
                    updateObj[fieldName] = fieldName === 'cantidad' ? Number(value) : value;

                    const { error } = await supabase.from('productos').update(updateObj).eq('id', id);
                    if (!error) fetchRecords();
                } catch (error) {
                    console.error('Error al actualizar campo:', error);
                }
            };

            const totalVariedad = productos.length;
            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-6">
                    <div className="max-w-7xl mx-auto space-y-8">
                        
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900">Control de Inventario de Oficina</h1>
                                <p className="text-sm text-slate-500">Sistema en la nube sincronizado con Supabase</p>
                            </div>
                            <div className="flex gap-4">
                                <div className="bg-indigo-50 border border-indigo-100 px-4 py-2 rounded-xl text-center">
                                    <span className="block text-xs text-indigo-500 font-semibold uppercase">Variedad</span>
                                    <span className="text-xl font-bold text-indigo-700">{totalVariedad}</span>
                                </div>
                                <div className="bg-emerald-50 border border-emerald-100 px-4 py-2 rounded-xl text-center">
                                    <span className="block text-xs text-emerald-500 font-semibold uppercase">Total Unidades</span>
                                    <span className="text-xl font-bold text-emerald-700">{totalUnidades}</span>
                                </div>
                            </div>
                        </header>

                        {errorMsg && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm">
                                <strong>Estado de conexión:</strong> {errorMsg}
                            </div>
                        )}

                        <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">➕ Registrar Nuevo Elemento</h2>
                            <form onSubmit={handleSubmit} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Código SKU</label>
                                    <input type="text" placeholder="Ej. PROD-014" value={formData.sku} onChange={e => setFormData({...formData, sku: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                                    <input type="text" placeholder="Ej. Cómputo" value={formData.categoria} onChange={e => setFormData({...formData, categoria: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Producto</label>
                                    <input type="text" placeholder="Ej. Laptops" value={formData.producto} onChange={e => setFormData({...formData, producto: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Cantidad</label>
                                    <input type="number" placeholder="Ej. 5" value={formData.cantidad} onChange={e => setFormData({...formData, cantidad: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Personal Asignado</label>
                                    <input type="text" placeholder="Ej. Jose, Ana" value={formData.personal_asignado} onChange={e => setFormData({...formData, personal_asignado: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Estado Stock</label>
                                    <select value={formData.estado_stock} onChange={e => setFormData({...formData, estado_stock: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                        <option value="Stock Adecuado">Stock Adecuado</option>
                                        <option value="Stock Bajo">Stock Bajo</option>
                                    </select>
                                </div>
                                <div className="sm:col-span-2">
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Observaciones</label>
                                    <input type="text" placeholder="Ej. Equipo principal" value={formData.observaciones} onChange={e => setFormData({...formData, observaciones: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                </div>
                                <div className="sm:col-span-2 lg:col-span-4 flex justify-end mt-2">
                                    <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-xl transition duration-200 shadow-sm">
                                        Guardar en el Inventario
                                    </button>
                                </div>
                            </form>
                        </section>

                        <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                <h2 className="text-lg font-semibold text-slate-800">📦 Inventario General y Asignaciones</h2>
                                <span className="text-xs text-slate-400 bg-slate-50 px-3 py-1 rounded-full border border-slate-200">Haz clic en cualquier celda para editar</span>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                            <th className="p-4 font-semibold">SKU</th>
                                            <th className="p-4 font-semibold">Categoría</th>
                                            <th className="p-4 font-semibold">Producto</th>
                                            <th className="p-4 font-semibold">Cantidad</th>
                                            <th className="p-4 font-semibold">Personal Asignado</th>
                                            <th className="p-4 font-semibold">Estado Stock</th>
                                            <th className="p-4 font-semibold">Observaciones</th>
                                            <th className="p-4 font-semibold text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {loading ? (
                                            <tr><td colSpan="8" className="p-6 text-center text-slate-400">Cargando datos desde Supabase...</td></tr>
                                        ) : productos.length === 0 ? (
                                            <tr><td colSpan="8" className="p-6 text-center text-slate-400">No hay productos registrados.</td></tr>
                                        ) : (
                                            productos.map((item) => (
                                                <tr key={item.id} className="hover:bg-slate-50/50 transition">
                                                    <td className="p-4 font-medium text-slate-700">
                                                        <input type="text" defaultValue={item.sku || ''} onBlur={(e) => handleUpdateField(item.id, 'sku', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full" />
                                                    </td>
                                                    <td className="p-4 text-slate-600">
                                                        <input type="text" defaultValue={item.categoria || ''} onBlur={(e) => handleUpdateField(item.id, 'categoria', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full" />
                                                    </td>
                                                    <td className="p-4 text-slate-800 font-medium">
                                                        <input type="text" defaultValue={item.producto || ''} onBlur={(e) => handleUpdateField(item.id, 'producto', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full" />
                                                    </td>
                                                    <td className="p-4 text-slate-600">
                                                        <input type="number" defaultValue={item.cantidad || 0} onBlur={(e) => handleUpdateField(item.id, 'cantidad', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-16" />
                                                    </td>
                                                    <td className="p-4 text-slate-600">
                                                        <input type="text" defaultValue={item.personal_asignado || ''} onBlur={(e) => handleUpdateField(item.id, 'personal_asignado', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full text-indigo-600 font-medium" />
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${item.estado_stock === 'Stock Bajo' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                                            {item.estado_stock}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-500 text-xs">
                                                        <input type="text" defaultValue={item.observaciones || ''} onBlur={(e) => handleUpdateField(item.id, 'observaciones', e.target.value)} className="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full" />
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => handleDelete(item.id)} className="px-3 py-1.5 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition font-medium">
                                                            Eliminar
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
