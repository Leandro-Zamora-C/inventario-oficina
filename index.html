                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/80 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Seleccionar Cargo --</option>
                                                    {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCargo(true)} className="px-5 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-extrabold whitespace-nowrap cursor-pointer transition-all">Gestionar Cargos</button>
                                            </div>
                                        ) : (
                                            <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="Escribe nuevo cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                    <button type="button" onClick={handleGuardarNuevoCargo} className="px-4 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">Guardar</button>
                                                    <button type="button" onClick={() => setCreandoCargo(false)} className="px-4 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">Cerrar</button>
                                                </div>
                                                <div className="pt-2 border-t border-slate-800">
                                                    <span className="text-[11px] font-bold text-slate-400 block mb-2">Eliminar Cargos Existentes:</span>
                                                    <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                                                        {cargosList.map(c => (
                                                            <span key={c.id} className="inline-flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold text-slate-300 border border-slate-700">
                                                                {c.nombre}
                                                                <button type="button" onClick={() => handleEliminarCargo(c.id, c.nombre)} className="text-rose-400 hover:text-rose-300 font-bold cursor-pointer">✕</button>
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer transition-all">Guardar Colaborador</button>
                                </form>
                            </section>
                        )}

                        {/* Historial Exclusivo de Asignaciones */}
                        {mostrarHistorial && (
                            <section className={`${darkMode ? 'bg-slate-900/60 border-slate-800/80' : 'bg-white/80 border-slate-200'} rounded-3xl border backdrop-blur-xl overflow-hidden shadow-2xl transition-all`}>
                                <div className="p-6 border-b border-slate-800/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h2 className="text-xl font-black">📜 Historial Exclusivo de Asignaciones</h2>
                                        <p className="text-xs text-slate-400">Mostrando productos unificados asignados a colaboradores</p>
                                    </div>
                                    <div className="w-full sm:w-auto">
                                        <input type="text" placeholder="🔍 Buscar..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="w-full sm:w-64 bg-slate-800/80 border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500" />
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-950/80 text-slate-400 text-xs font-black uppercase border-b border-slate-800/80">
                                                <th className="p-4">SKU</th>
                                                <th className="p-4">Categoría</th>
                                                <th className="p-4">Producto</th>
                                                <th className="p-4">Cantidad Acumulada</th>
                                                <th className="p-4">Asignado A</th>
                                                <th className="p-4">Observación</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60 text-sm">
                                            {productosPaginados.length === 0 ? (
                                                <tr><td colSpan="6" className="p-8 text-center text-slate-500 font-bold">No hay asignaciones registradas para mostrar.</td></tr>
                                            ) : (
                                                productosPaginados.map(item => (
                                                    <tr key={item.key} className="hover:bg-indigo-950/20 transition-colors">
                                                        <td className="p-4 font-black text-indigo-400">{item.sku}</td>
                                                        <td className="p-4 text-slate-400">{item.categoria}</td>
                                                        <td className="p-4 font-bold text-white">{item.producto}</td>
                                                        <td className="p-4 font-black"><span className="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs">{item.cantidad} unidades</span></td>
                                                        <td className="p-4"><span className="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">👤 {item.personal_asignado}</span></td>
                                                        <td className="p-4 text-xs text-slate-400">{item.observaciones || '-'}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* Modal Interactivo con Detalle del Inventario */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl`}>
                                    <div className="flex justify-between items-center border-b border-slate-800/80 pb-5">
                                        <h3 className="text-xl font-black">📋 Detalle del Inventario</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className="text-xs font-black px-4 py-2 bg-slate-800 text-slate-300 rounded-xl cursor-pointer hover:bg-slate-700 transition-all">✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className="bg-slate-950/80 border border-slate-800/80 p-5 rounded-2xl space-y-4">
                                            <h4 className="font-black text-xs uppercase tracking-widest text-indigo-400">Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-72 overflow-y-auto space-y-4 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl flex justify-between items-center text-sm font-semibold">
                                                            <span>👤 <strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 font-black hover:underline cursor-pointer">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosActivosList.map((item, idx) => (
                                                        <div key={idx} className="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl text-sm font-semibold flex justify-between items-center">
                                                            <span>📦 {item.producto} ({item.sku})</span>
                                                            <div className="flex gap-2 text-xs font-black">
                                                                <span className="bg-indigo-950 text-indigo-400 px-2.5 py-1 rounded-xl border border-indigo-900">Total: {item.cantidadTotal}</span>
                                                                <span className="bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-xl border border-emerald-900">Libres: {item.cantidadLibre}</span>
                                                                <span className="bg-amber-950 text-amber-400 px-2.5 py-1 rounded-xl border border-amber-900">En Uso: {item.cantidadUso}</span>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    Object.keys(asignacionesPorPersonalMap).length === 0 ? (
                                                        <p className="text-xs text-slate-500 font-bold text-center py-4">No hay asignaciones registradas.</p>
                                                    ) : (
                                                        Object.entries(asignacionesPorPersonalMap).map(([nombreColaborador, prodsAsignados]) => (
                                                            <div key={nombreColaborador} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                                                                <div className="font-black text-amber-400 text-sm border-b border-slate-800/80 pb-2 flex items-center justify-between">
                                                                    <span>👤 Colaborador: {nombreColaborador}</span>
                                                                    <span className="text-xs text-slate-400 font-bold">({prodsAsignados.length} tipos de productos)</span>
                                                                </div>

                                                                <div className="space-y-2.5 pl-2">
                                                                    {prodsAsignados.map(asigItem => (
                                                                        <div key={asigItem.key} className="bg-slate-950 border border-slate-800/80 p-3.5 rounded-xl space-y-2.5">
                                                                            <div className="flex justify-between items-start gap-2">
                                                                                <div>
                                                                                    <div className="font-extrabold text-xs text-indigo-300">📦 {asigItem.producto} ({asigItem.sku})</div>
                                                                                    <div className="text-[11px] text-slate-400 font-semibold mt-0.5">
                                                                                        Cantidad: <strong className="text-white">{asigItem.cantidad} unidades</strong>
                                                                                    </div>
                                                                                    <div className="text-[11px] text-slate-400 font-semibold mt-0.5">
                                                                                        Obs: <span className="text-slate-300 font-normal">{asigItem.observaciones || 'Sin observaciones'}</span>
                                                                                    </div>
                                                                                </div>
                                                                                
                                                                                <div className="flex items-center gap-2">
                                                                                    <button 
                                                                                        onClick={() => { setEditandoObsKey(asigItem.key); setNuevaObsTexto(asigItem.observaciones || ''); }} 
                                                                                        className="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500/20 cursor-pointer transition-all"
                                                                                    >
                                                                                        ✎ Editar Obs.
                                                                                    </button>
                                                                                    <button 
                                                                                        onClick={() => { setDevolviendoKey(asigItem.key); setCantDevolver(1); }} 
                                                                                        className="px-2.5 py-1 rounded-lg text-xs font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer transition-all"
                                                                                    >
                                                                                        Devolver
                                                                                    </button>
                                                                                </div>
                                                                            </div>

                                                                            {editandoObsKey === asigItem.key && (
                                                                                <div className="pt-2 border-t border-slate-800 flex items-center gap-2">
                                                                                    <input 
                                                                                        type="text" 
                                                                                        placeholder="Escribe la observación..." 
                                                                                        value={nuevaObsTexto} 
                                                                                        onChange={e => setNuevaObsTexto(e.target.value)} 
                                                                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white outline-none"
                                                                                    />
                                                                                    <button onClick={() => handleGuardarObservacionEditada(asigItem)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">Guardar</button>
                                                                                    <button onClick={() => setEditandoObsKey(null)} className="px-2 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                </div>
                                                                            )}

                                                                            {devolviendoKey === asigItem.key && (
                                                                                <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                                                                                    <div className="flex items-center gap-2">
                                                                                        <span className="text-[11px] text-slate-400 font-bold">Devolver:</span>
                                                                                        <input 
                                                                                            type="number" 
                                                                                            min="1" 
                                                                                            max={asigItem.cantidad} 
                                                                                            value={cantDevolver} 
                                                                                            onChange={e => setCantDevolver(e.target.value)} 
                                                                                            className="w-16 px-2 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-black text-white text-center" 
                                                                                        />
                                                                                        <span className="text-[11px] text-slate-500 font-semibold">(Max: {asigItem.cantidad})</span>
                                                                                    </div>
                                                                                    <div className="flex items-center gap-2">
                                                                                        <button onClick={() => handleEjecutarDevolucionAgrupada(asigItem)} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black hover:bg-emerald-700 cursor-pointer">Confirmar</button>
                                                                                        <button onClick={() => setDevolviendoKey(null)} className="px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                    </div>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
