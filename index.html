<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            
            const [darkMode, setDarkMode] = useState(true);

            const [itemEditando, setItemEditando] = useState(null);
            const [cantidadOriginal, setCantidadOriginal] = useState(0);
            const [personalEditando, setPersonalEditando] = useState(null);

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '', area: '' });
            const [formAsignacion, setFormAsignacion] = useState({ producto_id: '', personal_nombre: '', cantidad_asignada: 1 });

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: prodData } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('id', { ascending: false });
                    
                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const generarSKU = () => {
                if (!productos || productos.length === 0) return 'PROD-001';
                let maxNum = 0;
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const numStr = p.sku.replace('PROD-', '');
                        const num = parseInt(numStr, 10);
                        if (!isNaN(num) && num > maxNum) maxNum = num;
                    }
                });
                return `PROD-${String(maxNum + 1).padStart(3, '0')}`;
            };

            const categoriasUnicas = Array.from(new Set(productos.map(p => p.categoria).filter(Boolean)));

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                try {
                    const { error } = await supabase.from('productos').insert([{
                        sku: nuevoSKU,
                        categoria: formProducto.categoria,
                        producto: formProducto.producto,
                        cantidad: Number(formProducto.cantidad),
                        observaciones: formProducto.observaciones,
                        personal_asignado: ''
                    }]);

                    if (!error) {
                        setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                        fetchData();
                        alert(`¡Producto registrado con éxito! SKU: ${nuevoSKU}`);
                    } else {
                        alert('Error: ' + error.message);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('personal').insert([{
                        nombre: formPersonal.nombre,
                        cargo: formPersonal.cargo,
                        area: formPersonal.area
                    }]);

                    if (!error) {
                        setFormPersonal({ nombre: '', cargo: '', area: '' });
                        fetchData();
                        alert('¡Personal registrado con éxito!');
                    } else {
                        alert('Error: ' + error.message);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleAsignar = async (e) => {
                e.preventDefault();
                if (!formAsignacion.producto_id || !formAsignacion.personal_nombre) {
                    alert('Selecciona un producto libre y un miembro del personal.');
                    return;
                }

                const prodOriginal = productos.find(p => p.id == formAsignacion.producto_id);
                if (!prodOriginal) return;

                const cantAsignar = Number(formAsignacion.cantidad_asignada) || 1;
                if (cantAsignar > Number(prodOriginal.cantidad)) {
                    alert('No puedes asignar más cantidad de la disponible en stock.');
                    return;
                }

                try {
                    const asignacionExistente = productos.find(
                        p => p.sku === prodOriginal.sku && p.personal_asignado === formAsignacion.personal_nombre
                    );

                    if (asignacionExistente) {
                        const nuevaCantidadAsignada = Number(asignacionExistente.cantidad) + cantAsignar;
                        await supabase.from('productos')
                            .update({ cantidad: nuevaCantidadAsignada })
                            .eq('id', asignacionExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: prodOriginal.sku,
                            categoria: prodOriginal.categoria,
                            producto: prodOriginal.producto,
                            cantidad: cantAsignar,
                            observaciones: prodOriginal.observaciones || '',
                            personal_asignado: formAsignacion.personal_nombre
                        }]);
                    }

                    const resto = Number(prodOriginal.cantidad) - cantAsignar;
                    if (resto > 0) {
                        await supabase.from('productos').update({ cantidad: resto }).eq('id', prodOriginal.id);
                    } else {
                        await supabase.from('productos').delete().eq('id', prodOriginal.id);
                    }

                    setFormAsignacion({ producto_id: '', personal_nombre: '', cantidad_asignada: 1 });
                    fetchData();
                    alert('¡Asignación realizada con éxito!');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleEliminarRegistro = async (item) => {
                if (!window.confirm('¿Deseas eliminar este registro? Si tiene personal asignado, las unidades volverán a estar disponibles.')) return;

                try {
                    if (item.personal_asignado && item.personal_asignado.trim() !== '') {
                        const stockLibreExistente = productos.find(p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (stockLibreExistente) {
                            const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(item.cantidad);
                            await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku,
                                categoria: item.categoria,
                                producto: item.producto,
                                cantidad: item.cantidad,
                                observaciones: item.observaciones,
                                personal_asignado: ''
                            }]);
                        }
                    }

                    await supabase.from('productos').delete().eq('id', item.id);
                    fetchData();
                } catch (err) {
                    console.error(err);
                }
            };

            const handleGuardarEdicion = async (e) => {
                e.preventDefault();
                try {
                    const nuevaCantidad = Number(itemEditando.cantidad);
                    const diferencia = nuevaCantidad - cantidadOriginal;

                    if (itemEditando.personal_asignado && itemEditando.personal_asignado.trim() !== '' && diferencia !== 0) {
                        const stockLibre = productos.find(p => p.sku === itemEditando.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (diferencia > 0) {
                            if (!stockLibre || Number(stockLibre.cantidad) < diferencia) {
                                alert('No hay suficiente stock libre disponible para aumentar esta asignación.');
                                return;
                            }
                            const nuevoStockLibre = Number(stockLibre.cantidad) - diferencia;
                            if (nuevoStockLibre > 0) {
                                await supabase.from('productos').update({ cantidad: nuevoStockLibre }).eq('id', stockLibre.id);
                            } else {
                                await supabase.from('productos').delete().eq('id', stockLibre.id);
                            }
                        } else {
                            const diffPositiva = Math.abs(diferencia);
                            if (stockLibre) {
                                await supabase.from('productos').update({ cantidad: Number(stockLibre.cantidad) + diffPositiva }).eq('id', stockLibre.id);
                            } else {
                                await supabase.from('productos').insert([{
                                    sku: itemEditando.sku,
                                    categoria: itemEditando.categoria,
                                    producto: itemEditando.producto,
                                    cantidad: diffPositiva,
                                    observaciones: itemEditando.observaciones,
                                    personal_asignado: ''
                                }]);
                            }
                        }
                    }

                    await supabase.from('productos').update({
                        cantidad: nuevaCantidad,
                        personal_asignado: itemEditando.personal_asignado,
                        observaciones: itemEditando.observaciones
                    }).eq('id', itemEditando.id);

                    setItemEditando(null);
                    fetchData();
                    alert('¡Cambios guardados y stock sincronizado con éxito!');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleGuardarPersonalEdicion = async (e) => {
                e.preventDefault();
                try {
                    const nombreAntiguo = personalEditando.nombreAntiguo;
                    const nombreNuevo = personalEditando.nombre;

                    await supabase.from('personal').update({
                        nombre: personalEditando.nombre,
                        cargo: personalEditando.cargo,
                        area: personalEditando.area
                    }).eq('id', personalEditando.id);

                    if (nombreAntiguo !== nombreNuevo) {
                        const asignaciones = productos.filter(p => p.personal_asignado === nombreAntiguo);
                        for (const asig of asignaciones) {
                            await supabase.from('productos').update({ personal_asignado: nombreNuevo }).eq('id', asig.id);
                        }
                    }

                    setPersonalEditando(null);
                    fetchData();
                    alert('¡Personal actualizado con éxito!');
                } catch (err) {
                    console.error(err);
                    alert('Error al actualizar el personal.');
                }
            };

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Estás seguro de eliminar a "${persNombre}"? Todos sus equipos asignados volverán a estar disponibles (libres) en el inventario.`)) return;

                try {
                    const asignacionesDelPersonal = productos.filter(p => p.personal_asignado === persNombre);

                    for (const item of asignacionesDelPersonal) {
                        const stockLibreExistente = productos.find(
                            p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                        );

                        if (stockLibreExistente) {
                            const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(item.cantidad);
                            await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku,
                                categoria: item.categoria,
                                producto: item.producto,
                                cantidad: item.cantidad,
                                observaciones: item.observaciones,
                                personal_asignado: ''
                            }]);
                        }

                        await supabase.from('productos').delete().eq('id', item.id);
                    }

                    await supabase.from('personal').delete().eq('id', persId);

                    fetchData();
                    alert(`Personal "${persNombre}" eliminado y stock devuelto con éxito.`);
                } catch (err) {
                    console.error(err);
                    alert('Error al eliminar el personal.');
                }
            };

            const productosLibresDisponibles = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '');

            const productosFiltrados = productos.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesSinAsignar = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const registrosAsignados = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');

            const productosTotalesConsolidados = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku || curr.producto;
                    if (!acc[key]) {
                        acc[key] = { sku: curr.sku, producto: curr.producto, categoria: curr.categoria, cantidad: 0 };
                    }
                    acc[key].cantidad += Number(curr.cantidad) || 0;
                    return acc;
                }, {})
            );

            const asignacionesConsolidadas = Object.values(
                registrosAsignados.reduce((acc, curr) => {
                    const key = curr.sku || curr.producto;
                    if (!acc[key]) {
                        acc[key] = { sku: curr.sku, producto: curr.producto, asignaciones: [] };
                    }
                    acc[key].asignaciones.push({ persona: curr.personal_asignado, cantidad: curr.cantidad });
                    return acc;
                }, {})
            );

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} p-6 md:p-8 transition-colors duration-300`}>
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* Header Ejecutivo con Glassmorphism */}
                        <header className={`${darkMode ? 'bg-slate-900/80 border-slate-800/80 backdrop-blur-xl shadow-2xl' : 'bg-white/90 border-slate-200/80 shadow-xl backdrop-blur-xl'} p-6 md:p-8 rounded-3xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-6 transition-all`}>
                            <div className="flex items-center gap-5">
                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-lg ${darkMode ? 'bg-gradient-to-br from-indigo-600 to-violet-700 text-white shadow-indigo-500/20' : 'bg-gradient-to-br from-indigo-500 to-indigo-700 text-white shadow-indigo-500/30'}`}>
                                    🏢
                                </div>
                                <div className="space-y-1">
                                    <div className="flex items-center gap-3">
                                        <h1 className={`text-2xl md:text-3xl font-black tracking-tight ${darkMode ? 'text-white' : 'text-slate-900'}`}>Cordero y Asociados</h1>
                                        <span className="bg-indigo-600 text-white text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-widest shadow-lg shadow-indigo-600/40">PRO V2.0</span>
                                    </div>
                                    <div className="flex items-center gap-2.5">
                                        <span className="relative flex h-2.5 w-2.5">
                                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                          <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                                        </span>
                                        <p className={`text-xs font-semibold tracking-wide ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Sistema de Inventario Modular • Base de Datos Sincronizada</p>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`px-5 py-3.5 rounded-2xl font-bold text-sm transition-all duration-300 flex items-center gap-3 cursor-pointer border shadow-md hover:scale-105 active:scale-95 ${darkMode ? 'bg-slate-800/90 border-slate-700 text-amber-400 hover:bg-slate-800 hover:border-slate-600' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                                >
                                    <span className="text-base">{darkMode ? '☀️' : '🌙'}</span>
                                    <span>{darkMode ? 'Modo Claro' : 'Modo Oscuro'}</span>
                                </button>
                            </div>
                        </header>

                        {/* Tarjetas de Estadísticas (KPIs Interactivos con efectos de brillo) */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('total'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800/80 hover:border-indigo-500 hover:shadow-indigo-500/10' : 'bg-white/80 border-slate-200/80 hover:border-indigo-400 hover:shadow-xl'} p-6 rounded-3xl border shadow-lg backdrop-blur-md cursor-pointer transition-all duration-300 hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className={`block text-xs font-black tracking-widest uppercase mb-1.5 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Total Unidades</span>
                                    <span className={`text-3xl font-black ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>{totalUnidades}</span>
                                </div>
                                <div className={`p-4 rounded-2xl ${darkMode ? 'bg-indigo-950/80 text-indigo-400 border border-indigo-900/50' : 'bg-indigo-50 text-indigo-600'}`}>📦</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('libres'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800/80 hover:border-emerald-500 hover:shadow-emerald-500/10' : 'bg-white/80 border-slate-200/80 hover:border-emerald-400 hover:shadow-xl'} p-6 rounded-3xl border shadow-lg backdrop-blur-md cursor-pointer transition-all duration-300 hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className={`block text-xs font-black tracking-widest uppercase mb-1.5 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Unidades Libres</span>
                                    <span className={`text-3xl font-black ${darkMode ? 'text-emerald-400' : 'text-emerald-600'}`}>{unidadesSinAsignar}</span>
                                </div>
                                <div className={`p-4 rounded-2xl ${darkMode ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-900/50' : 'bg-emerald-50 text-emerald-600'}`}>🟢</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('personal'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800/80 hover:border-amber-500 hover:shadow-amber-500/10' : 'bg-white/80 border-slate-200/80 hover:border-amber-400 hover:shadow-xl'} p-6 rounded-3xl border shadow-lg backdrop-blur-md cursor-pointer transition-all duration-300 hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className={`block text-xs font-black tracking-widest uppercase mb-1.5 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Total Personal</span>
                                    <span className={`text-3xl font-black ${darkMode ? 'text-amber-400' : 'text-amber-600'}`}>{personalList.length}</span>
                                </div>
                                <div className={`p-4 rounded-2xl ${darkMode ? 'bg-amber-950/80 text-amber-400 border border-amber-900/50' : 'bg-amber-50 text-amber-600'}`}>👥</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('asignaciones'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800/80 hover:border-purple-500 hover:shadow-purple-500/10' : 'bg-white/80 border-slate-200/80 hover:border-purple-400 hover:shadow-xl'} p-6 rounded-3xl border shadow-lg backdrop-blur-md cursor-pointer transition-all duration-300 hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className={`block text-xs font-black tracking-widest uppercase mb-1.5 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Asignaciones Activas</span>
                                    <span className={`text-3xl font-black ${darkMode ? 'text-purple-400' : 'text-purple-600'}`}>{registrosAsignados.length}</span>
                                </div>
                                <div className={`p-4 rounded-2xl ${darkMode ? 'bg-purple-950/80 text-purple-400 border border-purple-900/50' : 'bg-purple-50 text-purple-600'}`}>🏷️</div>
                            </div>
                        </div>

                        {/* Pestañas de Navegación Estilizadas */}
                        <div className={`flex gap-3 ${darkMode ? 'bg-slate-900/80 border-slate-800/80 backdrop-blur-xl shadow-xl' : 'bg-white/90 border-slate-200/80 shadow-xl backdrop-blur-xl'} p-2.5 rounded-3xl border transition-colors`}>
                            <button 
                                onClick={() => setTabActiva('asignar')}
                                className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm transition-all duration-300 cursor-pointer flex items-center justify-center gap-2 ${tabActiva === 'asignar' ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-600/40 scale-[1.02]' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                <span>🔗</span> Asignar Productos
                            </button>
                            <button 
                                onClick={() => setTabActiva('productos')}
                                className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm transition-all duration-300 cursor-pointer flex items-center justify-center gap-2 ${tabActiva === 'productos' ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-600/40 scale-[1.02]' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                <span>📦</span> Gestión de Productos
                            </button>
                            <button 
                                onClick={() => setTabActiva('personal')}
                                className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm transition-all duration-300 cursor-pointer flex items-center justify-center gap-2 ${tabActiva === 'personal' ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-600/40 scale-[1.02]' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                <span>👥</span> Gestión de Personal
                            </button>
                        </div>

                        {/* APARTADO 1: ASIGNAR */}
                        {tabActiva === 'asignar' && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800/80 text-slate-100 shadow-2xl' : 'bg-white border-slate-200 text-slate-800 shadow-xl'} p-8 rounded-3xl border space-y-6 transition-all`}>
                                <h2 className="text-xl font-black flex items-center gap-3">
                                    <span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">🔗</span> Asignar Stock Disponible a Personal
                                </h2>
                                <form onSubmit={handleAsignar} className="grid grid-cols-1 sm:grid-cols-4 gap-5">
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Seleccionar Producto Libre</label>
                                        <select 
                                            value={formAsignacion.producto_id} 
                                            onChange={e => setFormAsignacion({...formAsignacion, producto_id: e.target.value})} 
                                            className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                                            required
                                        >
                                            <option value="">-- Elige un producto --</option>
                                            {productosLibresDisponibles.map(p => (
                                                <option key={p.id} value={p.id}>
                                                    {p.sku} - {p.producto} (Disponibles: {p.cantidad})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Seleccionar Personal</label>
                                        <select 
                                            value={formAsignacion.personal_nombre} 
                                            onChange={e => setFormAsignacion({...formAsignacion, personal_nombre: e.target.value})} 
                                            className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                                            required
                                        >
                                            <option value="">-- Elige al personal --</option>
                                            {personalList.map(pers => (
                                                <option key={pers.id} value={pers.nombre}>
                                                    {pers.nombre} ({pers.cargo || 'Sin cargo'})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad a Asignar</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            value={formAsignacion.cantidad_asignada} 
                                            onChange={e => setFormAsignacion({...formAsignacion, cantidad_asignada: e.target.value})} 
                                            className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                                            required 
                                        />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-95 cursor-pointer">
                                            Confirmar Asignación
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* APARTADO 2: PRODUCTOS */}
                        {tabActiva === 'productos' && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800/80 text-slate-100 shadow-2xl' : 'bg-white border-slate-200 text-slate-800 shadow-xl'} p-8 rounded-3xl border space-y-6 transition-all`}>
                                <h2 className="text-xl font-black flex items-center gap-3">
                                    <span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">📦</span> Agregar Nuevo Producto al Inventario
                                </h2>
                                <form onSubmit={handleSaveProducto} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Código SKU (Automático)</label>
                                        <input type="text" value={generarSKU()} disabled className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-black ${darkMode ? 'bg-slate-800/90 border-slate-700 text-indigo-400' : 'bg-slate-100 border-slate-300 text-slate-500'}`} />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Categoría</label>
                                        <input 
                                            type="text" 
                                            list="lista-categorias"
                                            placeholder="Elige o escribe categoría..." 
                                            value={formProducto.categoria} 
                                            onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} 
                                            className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} 
                                            required 
                                        />
                                        <datalist id="lista-categorias">
                                            {categoriasUnicas.map((cat, idx) => (
                                                <option key={idx} value={cat} />
                                            ))}
                                        </datalist>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre del Producto</label>
                                        <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad Total</label>
                                        <input type="number" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Observaciones</label>
                                        <input type="text" placeholder="Ej. Stock principal" value={formProducto.observaciones} onChange={e => setFormProducto({...formProducto, observaciones: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} />
                                    </div>
                                    <div className="sm:col-span-2 flex justify-end items-end">
                                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 px-8 rounded-2xl transition-all shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-95 cursor-pointer">
                                            Guardar Producto
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* APARTADO 3: PERSONAL */}
                        {tabActiva === 'personal' && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800/80 text-slate-100 shadow-2xl' : 'bg-white border-slate-200 text-slate-800 shadow-xl'} p-8 rounded-3xl border space-y-6 transition-all`}>
                                <h2 className="text-xl font-black flex items-center gap-3">
                                    <span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">👥</span> Registrar Nuevo Personal
                                </h2>
                                <form onSubmit={handleSavePersonal} className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cargo</label>
                                        <input type="text" placeholder="Ej. Desarrollador" value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-95 cursor-pointer">
                                            Guardar Personal
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* Listado General */}
                        <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800/80 shadow-2xl' : 'bg-white border-slate-200/80 shadow-xl'} rounded-3xl border overflow-hidden transition-all`}>
                            <div className={`p-6 md:p-8 border-b ${darkMode ? 'border-slate-800/80' : 'border-slate-200'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4`}>
                                <div>
                                    <h2 className={`text-xl font-black ${darkMode ? 'text-white' : 'text-slate-900'}`}>📦 Listado General de Inventario y Asignaciones</h2>
                                    <p className={`text-xs mt-1 font-semibold ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Control centralizado de existencias y asignaciones activas</p>
                                </div>
                                <div className="w-full sm:w-80">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 Buscar producto, personal, SKU..." 
                                        value={busqueda} 
                                        onChange={e => setBusqueda(e.target.value)} 
                                        className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white placeholder-slate-500' : 'bg-slate-50 border-slate-300'}`} 
                                    />
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className={`${darkMode ? 'bg-slate-950/80 text-slate-400 border-slate-800/80' : 'bg-slate-100 text-slate-600 border-slate-200'} text-xs font-black uppercase tracking-wider border-b`}>
                                            <th className="p-5 font-black">SKU</th>
                                            <th className="p-5 font-black">Categoría</th>
                                            <th className="p-5 font-black">Producto</th>
                                            <th className="p-5 font-black">Cantidad</th>
                                            <th className="p-5 font-black">Personal Asignado</th>
                                            <th className="p-5 font-black">Observaciones</th>
                                            <th className="p-5 font-black text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className={`divide-y ${darkMode ? 'divide-slate-800/80 text-slate-300' : 'divide-slate-200 text-slate-700'} text-sm font-medium`}>
                                        {loading ? (
                                            <tr><td colSpan="7" className="p-10 text-center text-slate-400 font-bold">Cargando registros...</td></tr>
                                        ) : productosFiltrados.length === 0 ? (
                                            <tr><td colSpan="7" className="p-10 text-center text-slate-400 font-bold">No se encontraron productos.</td></tr>
                                        ) : (
                                            productosFiltrados.map((item) => (
                                                <tr key={item.id} className={`transition-colors ${darkMode ? 'hover:bg-slate-800/50' : 'hover:bg-slate-50'}`}>
                                                    <td className={`p-5 font-black ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>{item.sku}</td>
                                                    <td className={`p-5 font-semibold ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{item.categoria}</td>
                                                    <td className={`p-5 font-extrabold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{item.producto}</td>
                                                    <td className={`p-5 font-black ${darkMode ? 'text-slate-200' : 'text-slate-800'}`}>{item.cantidad}</td>
                                                    <td className="p-5">
                                                        {item.personal_asignado && item.personal_asignado.trim() !== '' ? (
                                                            <span className="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-black bg-amber-500/10 text-amber-400 border border-amber-500/30 shadow-sm">
                                                                👤 {item.personal_asignado}
                                                            </span>
                                                        ) : (
                                                            <span className="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 shadow-sm">
                                                                🟢 Disponible (Sin asignar)
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className={`p-5 text-xs font-semibold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{item.observaciones || '-'}</td>
                                                    <td className="p-5 text-center space-x-2">
                                                        <button onClick={() => { setItemEditando(item); setCantidadOriginal(Number(item.cantidad)); }} className={`px-3.5 py-2 text-xs rounded-xl transition font-black cursor-pointer shadow-sm ${darkMode ? 'bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 border border-indigo-500/30' : 'text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200'}`}>
                                                            Editar
                                                        </button>
                                                        <button onClick={() => handleEliminarRegistro(item)} className={`px-3.5 py-2 text-xs rounded-xl transition font-black cursor-pointer shadow-sm ${darkMode ? 'bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/30' : 'text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200'}`}>
                                                            Eliminar
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        {/* Modal para Editar Fila de Producto */}
                        {itemEditando && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white shadow-2xl shadow-indigo-500/10' : 'bg-white border-slate-200 text-slate-800 shadow-2xl'} rounded-3xl border max-w-md w-full p-8 space-y-5 animate-in fade-in zoom-in duration-200`}>
                                    <h3 className="text-xl font-black">✏️ Editar Registro de Inventario</h3>
                                    <form onSubmit={handleGuardarEdicion} className="space-y-4">
                                        <div>
                                            <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad</label>
                                            <input type="number" min="1" value={itemEditando.cantidad} onChange={e => setItemEditando({...itemEditando, cantidad: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-300'}`} required />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Personal Asignado</label>
                                            <input type="text" value={itemEditando.personal_asignado || ''} onChange={e => setItemEditando({...itemEditando, personal_asignado: e.target.value})} placeholder="Vacío si está libre" className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-300'}`} />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Observaciones</label>
                                            <input type="text" value={itemEditando.observaciones || ''} onChange={e => setItemEditando({...itemEditando, observaciones: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-300'}`} />
                                        </div>
                                        <div className="flex justify-end gap-3 pt-3">
                                            <button type="button" onClick={() => setItemEditando(null)} className={`px-5 py-3 text-sm font-extrabold rounded-2xl cursor-pointer transition ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'text-slate-600 bg-slate-100 hover:bg-slate-200'}`}>Cancelar</button>
                                            <button type="submit" className="px-6 py-3 text-sm font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 rounded-2xl cursor-pointer shadow-lg shadow-indigo-600/30">Guardar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal para Editar Personal */}
                        {personalEditando && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-[9999]">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white shadow-2xl shadow-indigo-500/10' : 'bg-white border-slate-200 text-slate-800 shadow-2xl'} rounded-3xl border max-w-md w-full p-8 space-y-5 animate-in fade-in zoom-in duration-200`}>
                                    <h3 className="text-xl font-black">✏️ Editar Datos del Personal</h3>
                                    <form onSubmit={handleGuardarPersonalEdicion} className="space-y-4">
                                        <div>
                                            <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre Completo</label>
                                            <input type="text" value={personalEditando.nombre} onChange={e => setPersonalEditando({...personalEditando, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-300'}`} required />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-black uppercase tracking-wider mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cargo</label>
                                            <input type="text" value={personalEditando.cargo || ''} onChange={e => setPersonalEditando({...personalEditando, cargo: e.target.value})} placeholder="Ej. Desarrollador" className={`w-full border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-300'}`} />
                                        </div>
                                        <div className="flex justify-end gap-3 pt-3">
                                            <button type="button" onClick={() => setPersonalEditando(null)} className={`px-5 py-3 text-sm font-extrabold rounded-2xl cursor-pointer transition ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'text-slate-600 bg-slate-100 hover:bg-slate-200'}`}>Cancelar</button>
                                            <button type="submit" className="px-6 py-3 text-sm font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 rounded-2xl cursor-pointer shadow-lg shadow-indigo-600/30">Guardar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal Interactivo al hacer clic en las Tarjetas KPI */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white shadow-2xl' : 'bg-white border-slate-200 text-slate-800 shadow-2xl'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto animate-in fade-in zoom-in duration-200`}>
                                    <div className={`flex justify-between items-center border-b ${darkMode ? 'border-slate-800' : 'border-slate-200'} pb-5`}>
                                        <h3 className="text-xl font-black flex items-center gap-2">
                                            <span>📋</span> Detalle de la Oficina
                                        </h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className={`text-sm font-black px-4 py-2 rounded-xl cursor-pointer transition ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                            ✕ Cerrar
                                        </button>
                                    </div>

                                    {seccionSeleccionada && (
                                        <div className={`${darkMode ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'} border p-5 rounded-2xl space-y-4`}>
                                            <h4 className={`font-black text-xs uppercase tracking-widest ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>
                                                Filtrado por: {seccionSeleccionada.toUpperCase()}
                                            </h4>
                                            <div className="max-h-60 overflow-y-auto space-y-2.5 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} p-3.5 rounded-2xl border flex justify-between items-center text-sm font-semibold shadow-sm`}>
                                                            <span>👤 <strong>{p.nombre}</strong> <span className={`text-xs font-normal ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>({p.cargo || 'Sin cargo'})</span></span>
                                                            <div className="space-x-3">
                                                                <button onClick={() => setPersonalEditando({...p, nombreAntiguo: p.nombre})} className="text-xs text-indigo-400 hover:underline cursor-pointer font-black">Editar</button>
                                                                <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 hover:underline cursor-pointer font-black">Eliminar</button>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosTotalesConsolidados.map((item, idx) => (
                                                        <div key={idx} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200'} p-3.5 rounded-2xl border text-sm font-semibold shadow-sm flex justify-between items-center`}>
                                                            <span>📦 {item.producto}</span>
                                                            <span className={`px-3.5 py-1.5 rounded-xl text-xs font-black ${darkMode ? 'bg-indigo-950 text-indigo-400 border border-indigo-900' : 'bg-indigo-50 text-indigo-700'}`}>Total: {item.cantidad}</span>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'asignaciones' ? (
                                                    asignacionesConsolidadas.map((item, idx) => (
                                                        <div key={idx} className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-4 rounded-2xl border text-sm space-y-3 shadow-sm`}>
                                                            <div className={`font-black border-b pb-2 ${darkMode ? 'text-purple-400 border-slate-800' : 'text-purple-700 border-slate-200'}`}>
                                                                🏷️ {item.producto} <span className="text-xs text-slate-400 font-normal">({item.sku})</span>
                                                            </div>
                                                            <div className="flex flex-wrap gap-2">
                                                                {item.asignaciones.map((asig, aIdx) => (
                                                                    <span key={aIdx} className={`inline-flex items-center px-3 py-1.5 rounded-xl text-xs font-black ${darkMode ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' : 'bg-amber-50 text-amber-800 border border-amber-200'}`}>
                                                                        👤 {asig.persona} (Cant: {asig.cantidad})
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').map(item => (
                                                        <div key={item.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200'} p-3.5 rounded-2xl border text-sm font-semibold shadow-sm flex justify-between items-center`}>
                                                            <span>🟢 {item.producto} (Disponibles: {item.cantidad})</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
