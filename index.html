<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function Tooltip({ text, children }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative inline-block" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-1.5 bg-slate-900 text-white text-[11px] font-bold rounded-xl shadow-2xl border border-slate-700 whitespace-nowrap z-50 pointer-events-none">
                            {text}
                            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-900"></div>
                        </div>
                    )}
                </div>
            );
        }

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            const [mostrarHistorial, setMostrarHistorial] = useState(false);
            const [paginaActual, setPaginaActual] = useState(1);
            const [animandoTabla, setAnimandoTabla] = useState(false);
            const itemsPorPagina = 6;
            const [darkMode, setDarkMode] = useState(true);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            // Edición de observaciones en asignaciones
            const [editandoObsId, setEditandoObsId] = useState(null);
            const [nuevaObservacion, setNuevaObservacion] = useState('');

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formRestock, setFormRestock] = useState({ sku: '', cantidadExtra: '' });
            const [formEliminarProd, setFormEliminarProd] = useState({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '', area: '' });
            const [formAsignacion, setFormAsignacion] = useState({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });

            const mostrarToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => {
                    setToast(prev => ({ ...prev, show: false }));
                }, 3500);
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    // Cargar productos ordenados por id descendente (Lo más reciente primero)
                    const { data: prodData } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('nombre', { ascending: true });
                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                    mostrarToast('Error al sincronizar con la base de datos', 'error');
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const cambiarPagina = (nuevaPag) => {
                setAnimandoTabla(true);
                setPaginaActual(nuevaPag);
                setTimeout(() => setAnimandoTabla(false), 250);
            };

            const generarSKU = () => {
                const skusExistentes = new Set();
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const numStr = p.sku.replace('PROD-', '');
                        const num = parseInt(numStr, 10);
                        if (!isNaN(num)) skusExistentes.add(num);
                    }
                });
                let nuevoNum = 1;
                while (skusExistentes.has(nuevoNum)) {
                    nuevoNum++;
                }
                return `PROD-${String(nuevoNum).padStart(3, '0')}`;
            };

            const categoriasUnicas = Array.from(new Set(productos.map(p => p.categoria).filter(Boolean)));

            const productosLibresAgrupados = Object.values(
                productos
                    .filter(p => !p.personal_asignado || p.personal_asignado.trim() === '')
                    .reduce((acc, curr) => {
                        if (!acc[curr.sku]) {
                            acc[curr.sku] = { ...curr, cantidad: Number(curr.cantidad) || 0 };
                        } else {
                            acc[curr.sku].cantidad += Number(curr.cantidad) || 0;
                        }
                        return acc;
                    }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const productosUnicosList = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku;
                    if (key && !acc[key]) {
                        acc[key] = { 
                            sku: curr.sku, 
                            producto: curr.producto, 
                            categoria: curr.categoria,
                            cantidadTotal: 0,
                            cantidadLibre: 0,
                            cantidadUso: 0
                        };
                    }
                    if (acc[key]) {
                        const cant = Number(curr.cantidad) || 0;
                        acc[key].cantidadTotal += cant;
                        if (!curr.personal_asignado || curr.personal_asignado.trim() === '') {
                            acc[key].cantidadLibre += cant;
                        } else {
                            acc[key].cantidadUso += cant;
                        }
                    }
                    return acc;
                }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const productoSeleccionadoRestock = productosUnicosList.find(p => p.sku === formRestock.sku);
            const productoSeleccionadoEliminar = productosUnicosList.find(p => p.sku === formEliminarProd.sku);

            const descargarPlantillaCSV = () => {
                const cabecera = ['Categoria', 'Producto', 'Cantidad', 'Observaciones'];
                const ejemplo1 = ['Tecnologia', 'Laptop HP ProBook', '5', 'Stock inicial'];
                const ejemplo2 = ['Oficina', 'Silla Ergonomica', '12', 'Nuevo lote'];
                const csvContent = '\uFEFF' + [cabecera.join(';'), ejemplo1.join(';'), ejemplo2.join(';')].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'plantilla_importacion_productos.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                mostrarToast('Plantilla descargada correctamente.');
            };

            const handleImportarCSV = (e) => {
                const archivo = e.target.files[0];
                if (!archivo) return;
                const lector = new FileReader();
                lector.onload = async (evento) => {
                    try {
                        const texto = evento.target.result;
                        const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lineas.length < 2) {
                            mostrarToast('El archivo está vacío o no tiene formato válido.', 'error');
                            return;
                        }
                        const filas = lineas.slice(1);
                        let importadosCount = 0;
                        for (const fila of filas) {
                            const separador = fila.includes(';') ? ';' : ',';
                            const columnas = fila.split(separador).map(c => c.trim().replace(/^["']|["']$/g, ''));
                            if (columnas.length >= 3) {
                                const [categoria, productoNombre, cantidadStr, observaciones = 'Importado masivo'] = columnas;
                                const cantidad = parseInt(cantidadStr, 10);
                                if (productoNombre && !isNaN(cantidad) && cantidad > 0) {
                                    const productoExistente = productos.find(
                                        p => p.producto.toLowerCase() === productoNombre.toLowerCase() && (!p.personal_asignado || p.personal_asignado.trim() === '')
                                    );
                                    if (productoExistente) {
                                        const nuevaCant = Number(productoExistente.cantidad) + cantidad;
                                        await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', productoExistente.id);
                                    } else {
                                        const skusOcupados = new Set(productos.map(p => {
                                            if (p.sku && p.sku.startsWith('PROD-')) {
                                                return parseInt(p.sku.replace('PROD-', ''), 10);
                                            }
                                            return 0;
                                        }));
                                        let numSk = 1;
                                        while (skusOcupados.has(numSk)) numSk++;
                                        const nuevoSKU = `PROD-${String(numSk).padStart(3, '0')}`;
                                        skusOcupados.add(numSk);
                                        await supabase.from('productos').insert([{
                                            sku: nuevoSKU,
                                            categoria: categoria || 'General',
                                            producto: productoNombre,
                                            cantidad: cantidad,
                                            observaciones: observaciones,
                                            personal_asignado: ''
                                        }]);
                                    }
                                    importadosCount++;
                                }
                            }
                        }
                        fetchData();
                        mostrarToast(`¡Importación masiva exitosa! Se procesaron ${importadosCount} productos.`);
                        e.target.value = '';
                    } catch (err) {
                        console.error(err);
                        mostrarToast('Error al procesar el archivo.', 'error');
                    }
                };
                lector.readAsText(archivo, 'UTF-8');
            };

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                try {
                    const { error } = await supabase.from('productos').insert([{
                        sku: nuevoSKU,
                        categoria: formProducto.categoria,
                        producto: formProducto.producto,
                        cantidad: Number(formProducto.cantidad),
                        observaciones: formProducto.observaciones,
                        personal_asignado: ''
                    }]);
                    if (!error) {
                        setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                        fetchData();
                        mostrarToast(`¡Producto registrado con éxito! SKU: ${nuevoSKU}`);
                    } else {
                        mostrarToast('Error: ' + error.message, 'error');
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleRestockProducto = async (e) => {
                e.preventDefault();
                if (!formRestock.sku || !formRestock.cantidadExtra || Number(formRestock.cantidadExtra) <= 0) {
                    mostrarToast('Selecciona un producto e ingresa una cantidad válida.', 'error');
                    return;
                }
                try {
                    const cantidadSumar = Number(formRestock.cantidadExtra);
                    const filasLibresMismoSKU = productos.filter(
                        p => p.sku === formRestock.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                    );

                    if (filasLibresMismoSKU.length > 0) {
                        const filaPrincipal = filasLibresMismoSKU[0];
                        const nuevaCant = Number(filaPrincipal.cantidad) + cantidadSumar;
                        await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaPrincipal.id);
                        if (filasLibresMismoSKU.length > 1) {
                            for (let i = 1; i < filasLibresMismoSKU.length; i++) {
                                await supabase.from('productos').delete().eq('id', filasLibresMismoSKU[i].id);
                            }
                        }
                    } else {
                        const refProd = productos.find(p => p.sku === formRestock.sku);
                        await supabase.from('productos').insert([{
                            sku: refProd.sku,
                            categoria: refProd.categoria,
                            producto: refProd.producto,
                            cantidad: cantidadSumar,
                            observaciones: 'Reabastecido',
                            personal_asignado: ''
                        }]);
                    }
                    setFormRestock({ sku: '', cantidadExtra: '' });
                    fetchData();
                    mostrarToast('¡Stock reabastecido correctamente!');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al reabastecer stock', 'error');
                }
            };

            const handleEliminarProductoPorSKU = async (e) => {
                e.preventDefault();
                if (!formEliminarProd.sku) {
                    mostrarToast('Selecciona un producto para eliminar.', 'error');
                    return;
                }
                const prodRef = productosUnicosList.find(p => p.sku === formEliminarProd.sku);
                const nombreProd = prodRef ? prodRef.producto : formEliminarProd.sku;
                try {
                    if (formEliminarProd.eliminarTodo) {
                        if (!window.confirm(`¿Estás seguro de eliminar COMPLETAMENTE el producto "${nombreProd}"?`)) return;
                        const { error } = await supabase.from('productos').delete().eq('sku', formEliminarProd.sku);
                        if (!error) {
                            setFormEliminarProd({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
                            fetchData();
                            mostrarToast('Producto eliminado completamente.', 'error');
                        }
                    } else {
                        const cantQuitar = Number(formEliminarProd.cantidadEliminar);
                        if (cantQuitar <= 0) {
                            mostrarToast('Ingresa una cantidad válida.', 'error');
                            return;
                        }
                        const filaLibre = productos.find(p => p.sku === formEliminarProd.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                        if (!filaLibre || Number(filaLibre.cantidad) < cantQuitar) {
                            mostrarToast('No hay suficiente stock libre disponible.', 'error');
                            return;
                        }
                        const nuevaCant = Number(filaLibre.cantidad) - cantQuitar;
                        if (nuevaCant > 0) {
                            await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaLibre.id);
                        } else {
                            await supabase.from('productos').delete().eq('id', filaLibre.id);
                        }
                        setFormEliminarProd({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
                        fetchData();
                        mostrarToast(`Se eliminaron ${cantQuitar} unidades.`);
                    }
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al eliminar', 'error');
                }
            };

            const handleGuardarObservacion = async (prodId) => {
                try {
                    const { error } = await supabase.from('productos').update({ observaciones: nuevaObservacion }).eq('id', prodId);
                    if (!error) {
                        setEditandoObsId(null);
                        setNuevaObservacion('');
                        fetchData();
                        mostrarToast('Observación de la asignación actualizada.');
                    } else {
                        mostrarToast('Error al actualizar observación', 'error');
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('personal').insert([{
                        nombre: formPersonal.nombre,
                        cargo: formPersonal.cargo,
                        area: formPersonal.area
                    }]);
                    if (!error) {
                        setFormPersonal({ nombre: '', cargo: '', area: '' });
                        fetchData();
                        mostrarToast('¡Personal registrado con éxito!');
                    } else {
                        mostrarToast('Error: ' + error.message, 'error');
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleAsignar = async (e) => {
                e.preventDefault();
                if (!formAsignacion.producto_id || !formAsignacion.personal_nombre) {
                    mostrarToast('Selecciona un producto libre y un miembro del personal.', 'error');
                    return;
                }
                const prodOriginal = productos.find(p => p.id == formAsignacion.producto_id);
                if (!prodOriginal) return;
                const cantAsignar = Number(formAsignacion.cantidad_asignada) || 1;
                if (cantAsignar > Number(prodOriginal.cantidad)) {
                    mostrarToast('No puedes asignar más cantidad de la disponible.', 'error');
                    return;
                }
                try {
                    const asignacionExistente = productos.find(
                        p => p.sku === prodOriginal.sku && p.personal_asignado === formAsignacion.personal_nombre
                    );
                    if (asignacionExistente) {
                        const nuevaCantidadAsignada = Number(asignacionExistente.cantidad) + cantAsignar;
                        await supabase.from('productos').update({ 
                            cantidad: nuevaCantidadAsignada,
                            observaciones: formAsignacion.observaciones || asignacionExistente.observaciones
                        }).eq('id', asignacionExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: prodOriginal.sku,
                            categoria: prodOriginal.categoria,
                            producto: prodOriginal.producto,
                            cantidad: cantAsignar,
                            observaciones: formAsignacion.observaciones || '',
                            personal_asignado: formAsignacion.personal_nombre
                        }]);
                    }
                    const resto = Number(prodOriginal.cantidad) - cantAsignar;
                    if (resto > 0) {
                        await supabase.from('productos').update({ cantidad: resto }).eq('id', prodOriginal.id);
                    } else {
                        await supabase.from('productos').delete().eq('id', prodOriginal.id);
                    }
                    setFormAsignacion({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });
                    fetchData();
                    mostrarToast('¡Asignación realizada con éxito!');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleQuitarAsignacion = async (asigItem) => {
                if (!window.confirm(`¿Devolver ${asigItem.cantidad} unidades de "${asigItem.producto}" al stock libre?`)) return;
                try {
                    const stockLibreExistente = productos.find(
                        p => p.sku === asigItem.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                    );
                    if (stockLibreExistente) {
                        const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(asigItem.cantidad);
                        await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: asigItem.sku,
                            categoria: asigItem.categoria,
                            producto: asigItem.producto,
                            cantidad: asigItem.cantidad,
                            observaciones: asigItem.observaciones || 'Devuelto',
                            personal_asignado: ''
                        }]);
                    }
                    await supabase.from('productos').delete().eq('id', asigItem.id);
                    fetchData();
                    mostrarToast('Asignación retirada y stock devuelto.');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al quitar asignación', 'error');
                }
            };

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Eliminar a "${persNombre}"? Sus equipos volverán a stock libre.`)) return;
                try {
                    const asignacionesDelPersonal = productos.filter(p => p.personal_asignado === persNombre);
                    for (const item of asignacionesDelPersonal) {
                        const stockLibreExistente = productos.find(
                            p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                        );
                        if (stockLibreExistente) {
                            const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(item.cantidad);
                            await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku,
                                categoria: item.categoria,
                                producto: item.producto,
                                cantidad: item.cantidad,
                                observaciones: item.observaciones,
                                personal_asignado: ''
                            }]);
                        }
                        await supabase.from('productos').delete().eq('id', item.id);
                    }
                    await supabase.from('personal').delete().eq('id', persId);
                    fetchData();
                    mostrarToast('Personal eliminado y stock devuelto.');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al eliminar personal', 'error');
                }
            };

            const productosFiltrados = productos.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            const totalPaginas = Math.ceil(productosFiltrados.length / itemsPorPagina) || 1;
            const indiceUltimoItem = paginaActual * itemsPorPagina;
            const indicePrimerItem = indiceUltimoItem - itemsPorPagina;
            const productosPaginados = productosFiltrados.slice(indicePrimerItem, indiceUltimoItem);

            useEffect(() => {
                setPaginaActual(1);
            }, [busqueda]);

            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesSinAsignar = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesEnUso = totalUnidades - unidadesSinAsignar;
            const registrosAsignados = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} p-6 md:p-8 transition-colors duration-300`}>
                    {toast.show && (
                        <div className={`fixed top-6 right-6 z-[99999] px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-extrabold animate-bounce border ${toast.type === 'error' ? 'bg-rose-950/90 text-rose-300 border-rose-500/40' : 'bg-emerald-950/90 text-emerald-300 border-emerald-500/40'}`}>
                            <span>{toast.type === 'error' ? '❌' : '✨'}</span>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        <header className={`${darkMode ? 'bg-slate-900/80 border-slate-800/80 backdrop-blur-xl shadow-2xl' : 'bg-white/90 border-slate-200/80 shadow-xl backdrop-blur-xl'} p-6 md:p-8 rounded-3xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-6`}>
                            <div className="flex items-center gap-5">
                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-lg ${darkMode ? 'bg-gradient-to-br from-indigo-600 to-violet-700 text-white shadow-indigo-500/20' : 'bg-gradient-to-br from-indigo-500 to-indigo-700 text-white shadow-indigo-500/30'}`}>
                                    🏢
                                </div>
                                <div className="space-y-1">
                                    <div className="flex items-center gap-3">

                                    <div>
                                        <label className={`block text-xs font-black uppercase mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-black uppercase mb-2 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cargo</label>
                                        <input type="text" placeholder="Ej. Desarrollador" value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-600/30 cursor-pointer">Guardar Personal</button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {mostrarHistorial && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800/80 shadow-2xl' : 'bg-white border-slate-200/80 shadow-xl'} rounded-3xl border overflow-hidden`}>
                                <div className={`p-6 md:p-8 border-b ${darkMode ? 'border-slate-800/80' : 'border-slate-200'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4`}>
                                    <div>
                                        <h2 className={`text-xl font-black ${darkMode ? 'text-white' : 'text-slate-900'}`}>📜 Historial General de Movimientos (Ordenado por Recientes)</h2>
                                        <p className={`text-xs mt-1 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Mostrando {productosFiltrados.length} de {productos.length} registros</p>
                                    </div>
                                    <div className="flex items-center gap-3 w-full sm:w-auto">
                                        <input type="text" placeholder="🔍 Buscar..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className={`w-full sm:w-72 border rounded-2xl px-4 py-3 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800/90 border-slate-700 text-white placeholder-slate-500' : 'bg-slate-50 border-slate-300'}`} />
                                        <button onClick={() => { setMostrarHistorial(false); setBusqueda(''); }} className={`px-4 py-3 rounded-2xl text-xs font-extrabold cursor-pointer border ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 border-slate-300 text-slate-700'}`}>Ocultar</button>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className={`${darkMode ? 'bg-slate-950/80 text-slate-400 border-slate-800/80' : 'bg-slate-100 text-slate-600 border-slate-200'} text-xs font-black uppercase tracking-wider border-b`}>
                                                <th className="p-5">SKU</th>
                                                <th className="p-5">Categoría</th>
                                                <th className="p-5">Producto</th>
                                                <th className="p-5">Cantidad</th>
                                                <th className="p-5">Personal Asignado</th>
                                                <th className="p-5">Observaciones</th>
                                            </tr>
                                        </thead>
                                        <tbody className={`divide-y ${darkMode ? 'divide-slate-800/80 text-slate-300' : 'divide-slate-200 text-slate-700'} text-sm`}>
                                            {loading ? (
                                                <tr><td colSpan="6" className="p-10 text-center text-slate-400 font-bold">Cargando...</td></tr>
                                            ) : productosPaginados.length === 0 ? (
                                                <tr><td colSpan="6" className="p-10 text-center text-slate-400 font-bold">No se encontraron registros.</td></tr>
                                            ) : (
                                                productosPaginados.map(item => (
                                                    <tr key={item.id} className={`${darkMode ? 'hover:bg-indigo-950/30' : 'hover:bg-indigo-50/60'}`}>
                                                        <td className={`p-5 font-black ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>{item.sku}</td>
                                                        <td className={`p-5 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{item.categoria}</td>
                                                        <td className={`p-5 font-extrabold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{item.producto}</td>
                                                        <td className={`p-5 font-black ${darkMode ? 'text-slate-200' : 'text-slate-800'}`}>{item.cantidad}</td>
                                                        <td className="p-5">
                                                            {item.personal_asignado && item.personal_asignado.trim() !== '' ? (
                                                                <span className="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-black bg-amber-500/10 text-amber-400 border border-amber-500/30">👤 {item.personal_asignado}</span>
                                                            ) : (
                                                                <span className="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">🟢 Disponible</span>
                                                            )}
                                                        </td>
                                                        <td className={`p-5 text-xs ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                                                            {item.observaciones || '-'}
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* Modal Interactivo con Edición de Observaciones en Asignaciones */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto`}>
                                    <div className={`flex justify-between items-center border-b ${darkMode ? 'border-slate-800' : 'border-slate-200'} pb-5`}>
                                        <h3 className="text-xl font-black">📋 Detalle del Inventario de Oficina</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className={`text-sm font-black px-4 py-2 rounded-xl cursor-pointer ${darkMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-700'}`}>✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className={`${darkMode ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'} border p-5 rounded-2xl space-y-4`}>
                                            <h4 className={`font-black text-xs uppercase tracking-widest ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-60 overflow-y-auto space-y-2.5 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} p-3.5 rounded-2xl border flex justify-between items-center text-sm font-semibold`}>
                                                            <span>👤 <strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 hover:underline cursor-pointer font-black">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosList.map((item, idx) => (
                                                        <div key={idx} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200'} p-3.5 rounded-2xl border text-sm font-semibold shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2`}>
                                                            <div>
                                                                <span className="font-extrabold">📦 {item.producto}</span>
                                                                <span className="text-xs text-slate-400 ml-2">({item.sku})</span>
                                                            </div>
                                                            <div className="flex gap-2 text-xs font-black">
                                                                <span className="bg-indigo-950 text-indigo-400 border border-indigo-900/60 px-2.5 py-1 rounded-xl">Total: {item.cantidadTotal}</span>
                                                                <span className="bg-emerald-950 text-emerald-400 border border-emerald-900/60 px-2.5 py-1 rounded-xl">Libres: {item.cantidadLibre}</span>
                                                                <span className="bg-amber-950 text-amber-400 border border-amber-900/60 px-2.5 py-1 rounded-xl">En Uso: {item.cantidadUso}</span>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'asignaciones' ? (
                                                    /* Vista de Asignaciones con Edición de Observaciones */
                                                    registrosAsignados.map(asigItem => (
                                                        <div key={asigItem.id} className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-4 rounded-2xl border text-sm space-y-3`}>
                                                            <div className="flex justify-between items-center">
                                                                <div>
                                                                    <div className={`font-black ${darkMode ? 'text-purple-400' : 'text-purple-700'}`}>🏷️ {asigItem.producto} <span className="text-xs text-slate-400 font-normal">({asigItem.sku})</span></div>
                                                                    <div className={`text-xs ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>👤 Asignado a: <strong>{asigItem.personal_asignado}</strong> (Cant: <strong>{asigItem.cantidad}</strong>)</div>
                                                                </div>
                                                                <button onClick={() => handleQuitarAsignacion(asigItem)} className="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer">Devolver a Stock</button>
                                                            </div>

                                                            {/* Editor de Observación para la Asignación */}
                                                            <div className={`pt-2 border-t text-xs flex items-center justify-between gap-2 ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                                                                {editandoObsId === asigItem.id ? (
                                                                    <div className="flex items-center gap-2 w-full">
                                                                        <input 
                                                                            type="text" 
                                                                            value={nuevaObservacion} 
                                                                            onChange={e => setNuevaObservacion(e.target.value)} 
                                                                            placeholder="Escribe la observación..."
                                                                            className={`w-full px-3 py-1.5 rounded-xl border text-xs font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-100 border-slate-300'}`} 
                                                                        />
                                                                        <button onClick={() => handleGuardarObservacion(asigItem.id)} className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-black hover:bg-emerald-700">Guardar</button>
                                                                        <button onClick={() => setEditandoObsId(null)} className="px-3 py-1.5 rounded-xl bg-slate-700 text-slate-300 font-black">Cancelar</button>
                                                                    </div>
                                                                ) : (
                                                                    <>
                                                                        <span className={`${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>📝 Obs: <strong>{asigItem.observaciones || 'Sin observaciones'}</strong></span>
                                                                        <button 
                                                                            onClick={() => { setEditandoObsId(asigItem.id); setNuevaObservacion(asigItem.observaciones || ''); }} 
                                                                            className="text-indigo-400 hover:text-indigo-300 font-bold px-2 py-1 rounded-lg border border-indigo-500/20 hover:bg-indigo-500/10 cursor-pointer"
                                                                        >
                                                                            ✏️ Editar
                                                                        </button>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    productosLibresAgrupados.map(item => (
                                                        <div key={item.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200'} p-3.5 rounded-2xl border text-sm font-semibold flex justify-between items-center`}>
                                                            <span>🟢 {item.sku} - {item.producto} (Disponibles: {item.cantidad})</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
