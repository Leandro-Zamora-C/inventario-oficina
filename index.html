                                                                const activo = !!u.permisos?.[p.key];
                                                                return (
                                                                    <Tooltip key={p.key} text={`Haz clic para ${activo ? 'revocar' : 'conceder'} este permiso`} position="top">
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => handleTogglePermisoDirecto(u, p.key)}
                                                                            className={`w-full px-2.5 py-1.5 rounded-xl text-[11px] font-black border flex items-center justify-between cursor-pointer transition-all ${activo ? 'bg-indigo-500/20 border-indigo-500/50 text-indigo-500 shadow-sm' : modoClaro ? 'bg-white border-slate-300 text-slate-400' : 'bg-slate-900/40 border-slate-800 text-slate-500'}`}
                                                                        >
                                                                            <span>{p.label}</span>
                                                                            <span>{activo ? '✅' : '❌'}</span>
                                                                        </button>
                                                                    </Tooltip>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* PESTAÑA: ASIGNAR PRODUCTOS */}
                        {tabActiva === 'asignar' && tienePermiso('asignar') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200 text-slate-800' : 'bg-slate-900/60 border-slate-800/80 text-slate-100'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-200 dark:border-slate-800/60 pb-4">
                                    <div>
                                        <h2 className="text-xl font-black flex items-center gap-3">
                                            <span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 shadow-sm">🔗</span> Asignación de Productos
                                        </h2>
                                        <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1 font-medium`}>Selecciona uno o varios productos activos y colaboradores para asignar en una sola operación.</p>
                                    </div>
                                </div>

                                <form onSubmit={handleConfirmarAsignacionMultiple} className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-3">
                                            <label className="block text-[11px] font-black uppercase text-indigo-500 tracking-wider">
                                                1. Seleccionar Productos ({Object.keys(prodSeleccionadosMap).length} marcados)
                                            </label>
                                            <div className={`max-h-64 overflow-y-auto p-4 rounded-2xl ${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border space-y-2.5 shadow-inner`}>
                                                {productosLibresList.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay stock libre disponible.</p>
                                                ) : (
                                                    productosLibresList.map(p => {
                                                        const isChecked = !!prodSeleccionadosMap[p.id];
                                                        return (
                                                            <Tooltip key={p.id} text={`SKU: ${p.sku} ${p.serie ? `| Serie: ${p.serie}` : ''} | Disponibles en almacén: ${p.cantidad} unidades`} position="top">
                                                                <div className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 transition-all ${isChecked ? 'bg-indigo-500/15 border-indigo-500/60 shadow-md' : modoClaro ? 'bg-white border-slate-200 hover:border-slate-300' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                    <div className="flex items-center gap-3">
                                                                        <input 
                                                                            type="checkbox" 
                                                                            checked={isChecked} 
                                                                            onChange={() => toggleProductoSeleccionado(p.id)} 
                                                                            className="w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                                                                        />
                                                                        <div>
                                                                            <div className={`text-xs font-extrabold ${modoClaro ? 'text-slate-800' : 'text-white'}`}>
                                                                                <span className="font-mono text-indigo-500 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/30 mr-2">{p.sku}</span>
                                                                                {p.producto}
                                                                                {p.serie && <span className="ml-2 font-mono text-amber-500 text-[11px]">[{p.serie}]</span>}
                                                                            </div>
                                                                            <div className="text-[11px] text-slate-400 font-bold mt-1">Libres: {p.cantidad} unidades</div>
                                                                        </div>
                                                                    </div>

                                                                    {isChecked && (
                                                                        <div className="flex items-center gap-1.5">
                                                                            <span className="text-[10px] text-slate-400 font-bold">Cant/p:</span>

                                                                                <input 
                                                                                    type="number" 
                                                                                    min="1" 
                                                                                    max={p.cantidad} 
                                                                                    value={prodSeleccionadosMap[p.id]} 
                                                                                    onChange={e => updateCantProductoSeleccionado(p.id, e.target.value)} 
                                                                                    className={`w-14 px-2 py-1 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-lg text-xs font-black text-center focus:border-indigo-500 outline-none shadow-inner`} 
                                                                                />
                                                                            </Tooltip>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </Tooltip>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <label className="block text-[11px] font-black uppercase text-purple-500 tracking-wider">
                                                2. Seleccionar Colaboradores ({personalSeleccionados.length} marcados)
                                            </label>
                                            <div className={`max-h-64 overflow-y-auto p-4 rounded-2xl ${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border space-y-2.5 shadow-inner`}>
                                                {personalList.length === 0 ? (
                                                    <p className="text-xs text-slate-500 font-bold p-4 text-center">No hay colaboradores registrados.</p>
                                                ) : (
                                                    personalList.map(pers => {
                                                        const isChecked = personalSeleccionados.includes(pers.nombre);
                                                        return (
                                                            <Tooltip key={pers.id} text={`Cargo: ${pers.cargo || 'Sin cargo asignado'}`} position="top">
                                                                <div onClick={() => togglePersonalSeleccionado(pers.nombre)} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 cursor-pointer transition-all ${isChecked ? 'bg-purple-500/15 border-purple-500/60 shadow-md' : modoClaro ? 'bg-white border-slate-200 hover:border-slate-300' : 'bg-slate-900/60 border-slate-800/80 hover:border-slate-700'}`}>
                                                                    <div className="flex items-center gap-3">
                                                                        <input 
                                                                            type="checkbox" 
                                                                            checked={isChecked} 
                                                                            onChange={() => {}} 
                                                                            className="w-4 h-4 accent-purple-600 rounded cursor-pointer"
                                                                        />
                                                                        <Avatar nombre={pers.nombre} />
                                                                        <span className={`text-xs font-extrabold ${modoClaro ? 'text-slate-800' : 'text-white'}`}>{pers.nombre}</span>
                                                                    </div>
                                                                    <span className="text-[11px] font-bold text-slate-400">{pers.cargo || 'Sin cargo'}</span>
                                                                </div>
                                                            </Tooltip>
                                                        );
                                                    })
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4 pt-2 border-t border-slate-200 dark:border-slate-800/80">
                                        <div>
                                            <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Observaciones Generales (Opcional)</label>
                                            <input type="text" placeholder="Ej. Entrega para sede principal" value={obsAsignacion} onChange={e => setObsAsignacion(e.target.value)} className={`w-full ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700/80 text-white'} border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none focus:border-indigo-500 transition-all`} />
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 via-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-600/30 cursor-pointer text-sm btn-haptic border border-indigo-400/30">
                                            🚀 Confirmar Asignación ({Object.keys(prodSeleccionadosMap).length} Productos ➔ {personalSeleccionados.length} Personales)
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* PESTAÑA: PRODUCTOS / CSV */}
                        {tabActiva === 'productos' && tienePermiso('productos') && (
                            <div className="space-y-6 animate-tab">
                                <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-gradient-to-r from-indigo-950/50 via-slate-900/90 to-purple-950/50 border-indigo-500/30'} p-8 rounded-3xl border backdrop-blur-xl space-y-4 shadow-2xl`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-xl font-black flex items-center gap-3">
                                                <span className="p-2.5 rounded-xl bg-indigo-500/20 text-indigo-500 border border-indigo-500/30 shadow-sm">📊</span> Catálogo y Gestión Masiva CSV (Stock Almacén)
                                            </h2>
                                            <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} mt-1 font-medium`}>Exporta o actualiza el stock físico completo almacenado de cada producto.</p>
                                        </div>
                                        <button onClick={descargarInventarioCSV} className="px-5 py-3 rounded-2xl font-black text-xs bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 cursor-pointer flex items-center gap-2 btn-haptic border border-indigo-400/20">
                                            <span>📥</span> Exportar Catálogo CSV
                                        </button>
                                    </div>
                                    <div className={`p-6 rounded-2xl border border-dashed ${modoClaro ? 'border-slate-300 bg-slate-50' : 'border-slate-700 bg-slate-950/60'} flex flex-col sm:flex-row items-center justify-between gap-4`}>
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">📂</span>
                                            <div>
                                                <p className={`text-xs font-black ${modoClaro ? 'text-slate-800' : 'text-slate-200'}`}>Selecciona tu archivo CSV para actualizar/crear productos base</p>
                                                <p className="text-[11px] font-mono mt-0.5 text-slate-400">Columnas: SKU; Serie_Codigo; Categoria; Producto; Cantidad_Total_Stock; Observaciones; Estado</p>
                                            </div>
                                        </div>
                                        <input type="file" accept=".csv" onChange={handleImportarCSV} className="text-xs font-semibold text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:cursor-pointer transition file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                                    </div>
                                </section>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 shadow-sm">📦</span> Registrar Producto (Padre)</h2>
                                            <form onSubmit={handleSaveProducto} id="form-nuevo-prod" className="space-y-4">
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>SKU Autogenerado (Padre)</label>
                                                    <input type="text" value={generarSKU()} disabled className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-mono font-black ${modoClaro ? 'bg-slate-100 border-slate-300 text-indigo-600' : 'bg-slate-800/90 border-slate-700 text-indigo-400'} shadow-inner cursor-not-allowed`} />
                                                </div>

                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Categoría</label>
                                                    {!creandoCategoria ? (
                                                        <div className="flex gap-2">
                                                            <select value={formProducto.categoria} onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required>
                                                                <option value="">-- Categ. --</option>
                                                                {categoriasList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                            </select>
                                                            <button type="button" onClick={() => setCreandoCategoria(true)} className="px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-black whitespace-nowrap cursor-pointer btn-haptic border border-indigo-400/20 shadow-md">Gestionar</button>
                                                        </div>
                                                    ) : (
                                                        <div className={`p-4 rounded-2xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-950 border-slate-800'} border space-y-3 shadow-inner`}>
                                                            <div className="flex gap-2">
                                                                <input type="text" placeholder="Categoría..." value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-xl p-2.5 text-xs`} />
                                                                <button type="button" onClick={handleGuardarNuevaCategoria} className="px-3 bg-emerald-600 text-white rounded-xl text-xs font-black cursor-pointer">OK</button>
                                                                <button type="button" onClick={() => setCreandoCategoria(false)} className="px-3 bg-slate-700 text-slate-300 rounded-xl text-xs font-black cursor-pointer">✕</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Producto (Nombre Padre)</label>
                                                    <input type="text" placeholder="Ej. Laptop HP EliteBook" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required />
                                                </div>

                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'} flex justify-between items-center`}>
                                                        <span>Serie / Clasificación Inicial (Hijo)</span>
                                                        <span className="text-amber-500 text-[10px] lowercase font-bold">(Opcional)</span>
                                                    </label>
                                                    {!creandoSerie ? (
                                                        <div className="flex gap-2">
                                                            <select value={formProducto.serie} onChange={e => setFormProducto({...formProducto, serie: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-amber-600' : 'bg-slate-800/80 border-slate-700 text-amber-300'} font-mono`}>
                                                                <option value="">-- Sin Serie --</option>
                                                                {seriesList.map(s => <option key={s.id} value={s.nombre}>{s.nombre}</option>)}
                                                            </select>
                                                            <button type="button" onClick={() => setCreandoSerie(true)} className="px-4 py-3 bg-amber-600/20 text-amber-500 hover:bg-amber-600 hover:text-white rounded-2xl text-xs font-black whitespace-nowrap cursor-pointer btn-haptic border border-amber-500/30">Series</button>
                                                        </div>
                                                    ) : (
                                                        <div className={`p-4 rounded-2xl ${modoClaro ? 'bg-slate-100 border-slate-300' : 'bg-slate-950 border-slate-800'} border space-y-3 shadow-inner`}>
                                                            <div className="flex gap-2">
                                                                <input type="text" placeholder="Ej. HP-001" value={nuevaSerieNombre} onChange={e => setNuevaSerieNombre(e.target.value)} className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-xl p-2.5 text-xs uppercase font-mono`} />
                                                                <button type="button" onClick={handleGuardarNuevaSerie} className="px-3 bg-emerald-600 text-white rounded-xl text-xs font-black cursor-pointer">OK</button>
                                                                <button type="button" onClick={() => setCreandoSerie(false)} className="px-3 bg-slate-700 text-slate-300 rounded-xl text-xs font-black cursor-pointer">✕</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Cantidad Inicial Libre</label>
                                                    <input type="number" min="1" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-nuevo-prod" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer mt-4 btn-haptic border border-indigo-400/20">Guardar Producto Padre</button>
                                    </section>

                                    {/* REABASTECER */}
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 shadow-sm">➕</span> Reabastecer Stock</h2>
                                            <form onSubmit={handleRestockProducto} id="form-restock" className="space-y-4">
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>1. Seleccionar Producto (Padre)</label>
                                                    <select value={formRestock.sku} onChange={e => { setFormRestock({...formRestock, sku: e.target.value, serie: ''}); }} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required>
                                                        <option value="">-- Elige Producto Padre --</option>
                                                        {productosUnicosGlobalList.map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoRestock && (
                                                    <div className="space-y-3 animate-tab">
                                                        <div className="p-3.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex justify-between items-center text-xs font-black shadow-inner">
                                                            <span className="text-emerald-500">📦 Total Almacén Padre:</span>
                                                            <span className="bg-emerald-600 text-white px-3 py-1 rounded-xl shadow-md">{productoSeleccionadoRestock.cantidadTotal} unidades</span>
                                                        </div>

                                                        <div>
                                                            <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>2. Asignar Serie / Clasificación (Hijo)</label>
                                                            <select value={formRestock.serie} onChange={e => setFormRestock({...formRestock, serie: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-amber-600' : 'bg-slate-800/80 border-slate-700 text-amber-300'} font-mono`}>
                                                                <option value="">-- Sin Serie Específica --</option>
                                                                {seriesList.map(s => <option key={s.id} value={s.nombre}>{s.nombre}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                )}

                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Unidades a Sumar</label>
                                                    <input type="number" min="1" placeholder="Ej. 10" value={formRestock.cantidadExtra} onChange={e => setFormRestock({...formRestock, cantidadExtra: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required />
                                                </div>
                                            </form>
                                        </div>
                                        <button type="submit" form="form-restock" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-emerald-600/30 cursor-pointer mt-4 btn-haptic border border-emerald-400/20">Sumar Stock al Hijo</button>
                                    </section>

                                    {/* DESHABILITAR */}
                                    <section className={`${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl flex flex-col justify-between`}>
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-rose-500/10 text-rose-500 border border-rose-500/20 shadow-sm">🚫</span> Deshabilitar Producto / Serie</h2>
                                            
                                            <form onSubmit={handleDeshabilitarProducto} id="form-deshabilitar" className="space-y-4">
                                                <div>
                                                    <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>1. Seleccionar Producto (Padre)</label>
                                                    <select value={skuADeshabilitar} onChange={e => { setSkuADeshabilitar(e.target.value); setSerieADeshabilitar('TODAS'); }} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'}`} required>
                                                        <option value="">-- Elige Producto Padre --</option>
                                                        {productosUnicosGlobalList.filter(p => p.cantidadDeshabilitada < p.cantidadTotal).map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                    </select>
                                                </div>

                                                {productoSeleccionadoDeshabilitar && (
                                                    <div className="space-y-3 animate-tab">
                                                        <div>
                                                            <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>2. Seleccionar Serie a Deshabilitar (Hijo)</label>
                                                            <select value={serieADeshabilitar} onChange={e => setSerieADeshabilitar(e.target.value)} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-rose-600' : 'bg-slate-800/80 border-slate-700 text-rose-300'} font-mono`}>
                                                                <option value="TODAS">-- TODAS LAS SERIES DE ESTE PRODUCTO --</option>
                                                                {productoSeleccionadoDeshabilitar.seriesHijos.map((hijo, hIdx) => (
                                                                    <option key={hIdx} value={hijo.serie}>Serie: [{hijo.serie}] ({hijo.cantidadTotal} unid.)</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    </div>
                                                )}
                                            </form>
                                        </div>
                                        <button type="submit" form="form-deshabilitar" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-rose-600/30 cursor-pointer mt-4 btn-haptic border border-rose-400/20">Deshabilitar Selección</button>
                                    </section>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA: DESHABILITADOS */}
                        {tabActiva === 'deshabilitados' && tienePermiso('deshabilitados') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <div>
                                    <h2 className="text-xl font-black">🚫 Productos Deshabilitados</h2>
                                    <p className={`text-xs ${modoClaro ? 'text-slate-500' : 'text-slate-400'} font-medium`}>Estos productos se contabilizan en tus Métricas Totales de inventario, pero están ocultos del módulo de asignación.</p>
                                </div>
                                <div className="space-y-3">
                                    {productosDeshabilitados.length === 0 ? (
                                        <p className="text-sm font-bold text-slate-500 py-6 text-center">No hay productos deshabilitados actualmente.</p>
                                    ) : (
                                        productosDeshabilitados.map(item => (
                                            <div key={item.sku} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950/80 border-slate-800/80'} border p-4.5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-sm transition-all hover:border-slate-400`}>
                                                <div>
                                                    <div className="font-black text-indigo-500 font-mono text-sm">
                                                        {item.sku} - {item.producto}
                                                        {item.serie && <span className="ml-2 font-mono text-amber-500 text-xs">[{item.serie}]</span>}
                                                    </div>
                                                    <div className={`text-xs ${modoClaro ? 'text-slate-600' : 'text-slate-400'} mt-1 font-medium`}>Categoría: <strong>{item.categoria}</strong> • Stock contabilizado: <strong>{item.cantidadTotal} unidades</strong></div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => handleReactivarProducto(item.sku)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black cursor-pointer shadow-md btn-haptic">
                                                        🔄 Reactivar
                                                    </button>
                                                    <button onClick={() => handleEliminarDefinitivo(item.sku)} className="px-4 py-2 bg-rose-600/20 text-rose-500 border border-rose-500/30 rounded-xl text-xs font-black cursor-pointer hover:bg-rose-600 hover:text-white shadow-md btn-haptic">
                                                        🗑️ Eliminar Definitivamente
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {/* PESTAÑA: PERSONAL */}
                        {tabActiva === 'personal' && tienePermiso('personal') && (
                            <section className={`animate-tab ${modoClaro ? 'bg-white border-slate-200' : 'bg-slate-900/60 border-slate-800/80'} p-8 rounded-3xl border backdrop-blur-xl space-y-6 shadow-2xl`}>
                                <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 shadow-sm">👥</span> Agregar Nuevo Personal</h2>
                                <form onSubmit={handleSavePersonal} className="space-y-4">
                                    <div>
                                        <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'} focus:border-indigo-500 transition-colors`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-[11px] font-black uppercase mb-1.5 ${modoClaro ? 'text-slate-600' : 'text-slate-400'}`}>Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${modoClaro ? 'bg-slate-50 border-slate-300 text-slate-800' : 'bg-slate-800/80 border-slate-700 text-white'} focus:border-indigo-500 transition-colors`} required>
                                                    <option value="">-- Seleccionar Cargo --</option>

                                                                                📅 {fechaStr}
                                                                            </span>
                                                                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md ${modoClaro ? 'bg-white text-slate-600' : 'bg-slate-900 text-indigo-300'} text-[10px] font-mono font-semibold cursor-pointer`}>

                                                                                            <div className="flex items-center gap-3">
                                                                                                <span className="font-mono font-black text-indigo-500 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/30 cursor-pointer">{prodAgrup.sku}</span>

                                                                                                    <div className={`font-extrabold ${modoClaro ? 'text-slate-800' : 'text-white'} text-sm`}>
                                                                                                        {prodAgrup.producto}

                                                                                                </div>
                                                                                            </div>
                                                                                            <div className="flex items-center gap-3 flex-wrap">

                                                                                                            <span>{colab}</span>
                                                                                                        </div>
                                                                                                    ))}
                                                                                                </div>
                                                                                            </div>

                                                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded-xl text-xs font-bold">
                                                                        <Avatar nombre={grupo.personal_asignado} />
                                                                        <span>{grupo.personal_asignado}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-xs text-slate-400 text-center font-bold">{grupo.observacionesLimpia}</td>
                                                            </tr>

                                                    productosUnicosGlobalList.map((padre) => {

                                                                    <div>
                                                                        <span className="font-extrabold text-sm">
                                                                            📦 {padre.producto} (<strong className="font-mono text-indigo-500">{padre.sku}</strong>)

                                                                            {estaProdExpandido ? '📂 Ocultar Hijos' : '👁️ Ver Series / Hijos'}

                                                                                    🏷️ [{hijo.serie}]

                                                                                    <span className="text-amber-500">| Uso: {hijo.cantidadUso}</span>
                                                                                    <span className="text-rose-500">| Deshab: {hijo.cantidadDeshabilitada}</span>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ))
                                                ) : (
                                                    Object.keys(asignacionesAgrupadasListMap).length === 0 ? (
                                                        <p className="text-xs text-slate-500 font-bold text-center py-4">No hay asignaciones registradas.</p>

                                                                                    <div key={asigItem.sku} className={`${modoClaro ? 'bg-slate-50 border-slate-200' : 'bg-slate-950 border-slate-800/80'} border p-3.5 rounded-xl space-y-2.5`}>
                                                                                        <div className="flex justify-between items-start gap-2">

                                                                                                <div className="font-extrabold text-xs text-indigo-500">
                                                                                                    📦 {asigItem.producto} (<span className="font-mono">{asigItem.sku}</span>)

                                                                                                </div>
                                                                                                <div className="text-[11px] text-slate-400 font-semibold mt-1 flex items-center gap-2">

                                                                                                </div>
                                                                                                <div className="text-[11px] text-slate-400 font-semibold mt-1">
                                                                                                    Obs: <span className={`${modoClaro ? 'text-slate-600' : 'text-slate-300'} font-normal`}>{obsItemLimpia}</span>
                                                                                                </div>
                                                                                            </div>
                                                                                            
                                                                                            <div className="flex items-center gap-2">
                                                                                                <button 
                                                                                                    onClick={() => { setEditandoObsKey(asigItem.sku); setNuevaObsTexto(obsItemLimpia !== 'Sin observaciones' ? obsItemLimpia : ''); }} 
                                                                                                    className="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-indigo-500/10 text-indigo-500 border border-indigo-500/30 hover:bg-indigo-500/20 cursor-pointer transition-all"
                                                                                                >
                                                                                                    ✎ Editar Obs.
                                                                                                </button>
                                                                                                <button 
                                                                                                    onClick={() => { setDevolviendoKey(asigItem.sku); setCantDevolver(1); }} 
                                                                                                    className="px-2.5 py-1 rounded-lg text-xs font-black bg-rose-500/10 text-rose-500 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer transition-all"
                                                                                                >
                                                                                                    Devolver
                                                                                                </button>
                                                                                            </div>
                                                                                        </div>

                                                                                        {editandoObsKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                                                                                                <input 
                                                                                                    type="text" 
                                                                                                    placeholder="Escribe la observación..." 
                                                                                                    value={nuevaObsTexto} 
                                                                                                    onChange={e => setNuevaObsTexto(e.target.value)} 
                                                                                                    className={`w-full ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-900 border-slate-700'} border rounded-lg px-2.5 py-1 text-xs outline-none focus:border-indigo-500 transition-colors`}
                                                                                                />
                                                                                                <button onClick={() => handleGuardarObservacionEditada(asigItem)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black cursor-pointer">Guardar</button>
                                                                                                <button onClick={() => setEditandoObsKey(null)} className="px-2 py-1 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                            </div>
                                                                                        )}

                                                                                        {devolviendoKey === asigItem.sku && (
                                                                                            <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                                                                                                <div className="flex items-center gap-2">
                                                                                                    <span className="text-[11px] text-slate-400 font-bold">Devolver:</span>
                                                                                                    <input 
                                                                                                        type="number" 
                                                                                                        min="1" 
                                                                                                        max={asigItem.cantidad} 
                                                                                                        value={cantDevolver} 
                                                                                                        onChange={e => setCantDevolver(e.target.value)} 
                                                                                                        className={`w-16 px-2 py-1 ${modoClaro ? 'bg-white border-slate-300 text-slate-800' : 'bg-slate-800 border-slate-700 text-white'} border rounded-lg text-xs font-black text-center focus:border-indigo-500 outline-none`} 
                                                                                                    />
                                                                                                    <span className="text-[11px] text-slate-400 font-semibold">(Max: {asigItem.cantidad})</span>
                                                                                                </div>
                                                                                                <div className="flex items-center gap-2">
                                                                                                    <button onClick={() => handleEjecutarDevolucionAgrupada(asigItem)} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black hover:bg-emerald-700 cursor-pointer">Confirmar</button>
                                                                                                    <button onClick={() => setDevolviendoKey(null)} className="px-2.5 py-1 bg-slate-700 text-slate-300 rounded-lg text-xs font-black cursor-pointer">✕</button>
                                                                                                </div>
                                                                                            </div>
                                                                                        )}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<InventoryApp />, rootElement);
        }
    </script>
</body>
</html>
