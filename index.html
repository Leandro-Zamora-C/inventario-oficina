<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [categoriasList, setCategoriasList] = useState([]);
            const [cargosList, setCargosList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            const [mostrarHistorial, setMostrarHistorial] = useState(false);
            const [paginaActual, setPaginaActual] = useState(1);
            const itemsPorPagina = 6;
            const [darkMode, setDarkMode] = useState(true);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const [editandoObsId, setEditandoObsId] = useState(null);
            const [nuevaObservacion, setNuevaObservacion] = useState('');

            // Modos de creación rápida en desplegables
            const [creandoCategoria, setCreandoCategoria] = useState(false);
            const [nuevaCatNombre, setNuevaCatNombre] = useState('');

            const [creandoCargo, setCreandoCargo] = useState(false);
            const [nuevoCargoNombre, setNuevoCargoNombre] = useState('');

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formRestock, setFormRestock] = useState({ sku: '', cantidadExtra: '' });
            const [formEliminarProd, setFormEliminarProd] = useState({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '' });
            const [formAsignacion, setFormAsignacion] = useState({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });

            const mostrarToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3500);
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: prodData } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('nombre', { ascending: true });
                    const { data: catData } = await supabase.from('categorias').select('*').order('nombre', { ascending: true });
                    const { data: cargoData } = await supabase.from('cargos').select('*').order('nombre', { ascending: true });

                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                    setCategoriasList(catData || []);
                    setCargosList(cargoData || []);
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const handleGuardarNuevaCategoria = async () => {
                if (!nuevaCatNombre.trim()) return;
                try {
                    const { error } = await supabase.from('categorias').insert([{ nombre: nuevaCatNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Categoría creada exitosamente.');
                        setFormProducto({ ...formProducto, categoria: nuevaCatNombre.trim() });
                        setNuevaCatNombre('');
                        setCreandoCategoria(false);
                        fetchData();
                    } else {
                        mostrarToast('La categoría ya existe o hubo un error.', 'error');
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleGuardarNuevoCargo = async () => {
                if (!nuevoCargoNombre.trim()) return;
                try {
                    const { error } = await supabase.from('cargos').insert([{ nombre: nuevoCargoNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Cargo creado exitosamente.');
                        setFormPersonal({ ...formPersonal, cargo: nuevoCargoNombre.trim() });
                        setNuevoCargoNombre('');
                        setCreandoCargo(false);
                        fetchData();
                    } else {
                        mostrarToast('El cargo ya existe o hubo un error.', 'error');
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const generarSKU = () => {
                const skusExistentes = new Set();
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const num = parseInt(p.sku.replace('PROD-', ''), 10);
                        if (!isNaN(num)) skusExistentes.add(num);
                    }
                });
                let nuevoNum = 1;
                while (skusExistentes.has(nuevoNum)) nuevoNum++;
                return `PROD-${String(nuevoNum).padStart(3, '0')}`;
            };

            // Filtrado exclusivo para Historial de Asignaciones (Solo productos con personal asignado)
            const historialAsignaciones = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');
            
            const historialFiltrado = historialAsignaciones.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            const totalPaginas = Math.ceil(historialFiltrado.length / itemsPorPagina) || 1;
            const productosPaginados = historialFiltrado.slice((paginaActual - 1) * itemsPorPagina, paginaActual * itemsPorPagina);

            const productosLibresAgrupados = Object.values(
                productos
                    .filter(p => !p.personal_asignado || p.personal_asignado.trim() === '')
                    .reduce((acc, curr) => {
                        if (!acc[curr.sku]) acc[curr.sku] = { ...curr, cantidad: Number(curr.cantidad) || 0 };
                        else acc[curr.sku].cantidad += Number(curr.cantidad) || 0;
                        return acc;
                    }, {})
            );

            const productosUnicosList = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku;
                    if (!acc[key]) acc[key] = { sku: curr.sku, producto: curr.producto, cantidadTotal: 0, cantidadLibre: 0, cantidadUso: 0 };
                    const cant = Number(curr.cantidad) || 0;
                    acc[key].cantidadTotal += cant;
                    if (!curr.personal_asignado || curr.personal_asignado.trim() === '') acc[key].cantidadLibre += cant;
                    else acc[key].cantidadUso += cant;
                    return acc;
                }, {})
            );

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                const { error } = await supabase.from('productos').insert([{
                    sku: nuevoSKU,
                    categoria: formProducto.categoria,
                    producto: formProducto.producto,
                    cantidad: Number(formProducto.cantidad),
                    observaciones: formProducto.observaciones,
                    personal_asignado: ''
                }]);
                if (!error) {
                    setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                    fetchData();
                    mostrarToast(`Producto registrado. SKU: ${nuevoSKU}`);
                }
            };

            const handleAsignar = async (e) => {
                e.preventDefault();
                const prodOriginal = productos.find(p => p.id == formAsignacion.producto_id);
                if (!prodOriginal) return;
                const cantAsignar = Number(formAsignacion.cantidad_asignada) || 1;

                await supabase.from('productos').insert([{
                    sku: prodOriginal.sku,
                    categoria: prodOriginal.categoria,
                    producto: prodOriginal.producto,
                    cantidad: cantAsignar,
                    observaciones: formAsignacion.observaciones || '',
                    personal_asignado: formAsignacion.personal_nombre
                }]);

                const resto = Number(prodOriginal.cantidad) - cantAsignar;
                if (resto > 0) await supabase.from('productos').update({ cantidad: resto }).eq('id', prodOriginal.id);
                else await supabase.from('productos').delete().eq('id', prodOriginal.id);

                setFormAsignacion({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });
                fetchData();
                mostrarToast('Asignación registrada con éxito.');
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                const { error } = await supabase.from('personal').insert([{
                    nombre: formPersonal.nombre,
                    cargo: formPersonal.cargo
                }]);
                if (!error) {
                    setFormPersonal({ nombre: '', cargo: '' });
                    fetchData();
                    mostrarToast('Personal registrado con éxito.');
                }
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} p-6 md:p-8`}>
                    {toast.show && (
                        <div className="fixed top-6 right-6 z-50 px-5 py-3.5 rounded-2xl bg-emerald-950 text-emerald-300 border border-emerald-500/40 shadow-2xl font-bold">
                            ✨ {toast.message}
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        <header className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-6 rounded-3xl border flex justify-between items-center`}>
                            <h1 className="text-2xl font-black">Cordero y Asociados</h1>
                            <button onClick={() => setMostrarHistorial(!mostrarHistorial)} className="px-4 py-2 bg-indigo-600 text-white rounded-2xl font-bold text-xs">
                                📜 {mostrarHistorial ? 'Ocultar Historial' : 'Ver Historial de Asignaciones'}
                            </button>
                        </header>

                        {/* Pestañas de Acciones */}
                        <div className="flex gap-3">
                            <button onClick={() => setTabActiva('asignar')} className={`flex-1 py-3.5 rounded-2xl font-extrabold ${tabActiva === 'asignar' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>🔗 Asignar Productos</button>
                            <button onClick={() => setTabActiva('productos')} className={`flex-1 py-3.5 rounded-2xl font-extrabold ${tabActiva === 'productos' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>📦 Registrar Productos</button>
                            <button onClick={() => setTabActiva('personal')} className={`flex-1 py-3.5 rounded-2xl font-extrabold ${tabActiva === 'personal' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>👥 Agregar Personal</button>
                        </div>

                        {/* Formulario Registrar Producto con Categoría Desplegable / Dinámica */}
                        {tabActiva === 'productos' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-8 rounded-3xl border space-y-4`}>
                                <h2 className="text-xl font-black">📦 Registrar Nuevo Producto</h2>
                                <form onSubmit={handleSaveProducto} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-1">Categoría</label>
                                        {!creandoCategoria ? (
                                            <div className="flex gap-2">
                                                <select value={formProducto.categoria} onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required>
                                                    <option value="">-- Seleccionar Categoría --</option>
                                                    {categoriasList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCategoria(true)} className="px-4 bg-indigo-600 rounded-2xl text-xs font-bold whitespace-nowrap">+ Nueva Categoría</button>
                                            </div>
                                        ) : (
                                            <div className="flex gap-2">
                                                <input type="text" placeholder="Nombre nueva categoría..." value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" />
                                                <button type="button" onClick={handleGuardarNuevaCategoria} className="px-4 bg-emerald-600 rounded-2xl text-xs font-bold">Guardar</button>
                                                <button type="button" onClick={() => setCreandoCategoria(false)} className="px-4 bg-slate-700 rounded-2xl text-xs font-bold">Cancelar</button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black uppercase mb-1">Nombre del Producto</label>
                                        <input type="text" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-1">Cantidad Inicial</label>
                                        <input type="number" min="1" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 font-extrabold py-3.5 rounded-2xl">Guardar Producto</button>
                                </form>
                            </section>
                        )}

                        {/* Formulario Asignar */}
                        {tabActiva === 'asignar' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-8 rounded-3xl border space-y-4`}>
                                <h2 className="text-xl font-black">🔗 Asignar Stock a Personal</h2>
                                <form onSubmit={handleAsignar} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <select value={formAsignacion.producto_id} onChange={e => setFormAsignacion({...formAsignacion, producto_id: e.target.value})} className="bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required>
                                        <option value="">-- Seleccionar Producto --</option>
                                        {productosLibresAgrupados.map(p => <option key={p.id} value={p.id}>{p.sku} - {p.producto} ({p.cantidad} libres)</option>)}
                                    </select>
                                    <select value={formAsignacion.personal_nombre} onChange={e => setFormAsignacion({...formAsignacion, personal_nombre: e.target.value})} className="bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required>
                                        <option value="">-- Seleccionar Personal --</option>
                                        {personalList.map(pers => <option key={pers.id} value={pers.nombre}>{pers.nombre} ({pers.cargo})</option>)}
                                    </select>
                                    <input type="number" min="1" value={formAsignacion.cantidad_asignada} onChange={e => setFormAsignacion({...formAsignacion, cantidad_asignada: e.target.value})} className="bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required />
                                    <input type="text" placeholder="Observaciones..." value={formAsignacion.observaciones} onChange={e => setFormAsignacion({...formAsignacion, observaciones: e.target.value})} className="bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" />
                                    <button type="submit" className="sm:col-span-2 lg:col-span-4 bg-indigo-600 font-extrabold py-3.5 rounded-2xl">Confirmar Asignación</button>
                                </form>
                            </section>
                        )}

                        {/* Formulario Agregar Personal con Cargo Desplegable / Dinámico */}
                        {tabActiva === 'personal' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-8 rounded-3xl border space-y-4`}>
                                <h2 className="text-xl font-black">👥 Agregar Nuevo Personal</h2>
                                <form onSubmit={handleSavePersonal} className="space-y-4">
                                    <input type="text" placeholder="Nombre completo" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required />
                                    
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-1">Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" required>
                                                    <option value="">-- Seleccionar Cargo --</option>
                                                    {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCargo(true)} className="px-4 bg-indigo-600 rounded-2xl text-xs font-bold whitespace-nowrap">+ Nuevo Cargo</button>
                                            </div>
                                        ) : (
                                            <div className="flex gap-2">
                                                <input type="text" placeholder="Nombre nuevo cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-2xl p-3 text-sm" />
                                                <button type="button" onClick={handleGuardarNuevoCargo} className="px-4 bg-emerald-600 rounded-2xl text-xs font-bold">Guardar</button>
                                                <button type="button" onClick={() => setCreandoCargo(false)} className="px-4 bg-slate-700 rounded-2xl text-xs font-bold">Cancelar</button>
                                            </div>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 font-extrabold py-3.5 rounded-2xl">Guardar Colaborador</button>
                                </form>
                            </section>
                        )}

                        {/* Historial Exclusivo de Asignaciones con Opciones de Lectura y Limpieza */}
                        {mostrarHistorial && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} rounded-3xl border overflow-hidden`}>
                                <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                                    <div>
                                        <h2 className="text-xl font-black">📜 Historial Exclusivo de Asignaciones</h2>
                                        <p className="text-xs text-slate-400">Mostrando sólo productos asignados actualmente a colaboradores</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => { setBusqueda(''); setMostrarHistorial(false); }} className="px-4 py-2 bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-2xl text-xs font-bold">
                                            🧹 Limpiar Vista de Historial
                                        </button>
                                        <input type="text" placeholder="🔍 Buscar asignaciones..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="bg-slate-800 border-slate-700 rounded-2xl px-4 py-2 text-sm" />
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-950 text-slate-400 text-xs font-black uppercase border-b border-slate-800">
                                                <th className="p-4">SKU</th>
                                                <th className="p-4">Categoría</th>
                                                <th className="p-4">Producto</th>
                                                <th className="p-4">Cantidad</th>
                                                <th className="p-4">Asignado A</th>
                                                <th className="p-4">Observación</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800 text-sm">
                                            {productosPaginados.length === 0 ? (
                                                <tr><td colSpan="6" className="p-8 text-center text-slate-500 font-bold">No hay asignaciones registradas para mostrar.</td></tr>
                                            ) : (
                                                productosPaginados.map(item => (
                                                    <tr key={item.id} className="hover:bg-indigo-950/20">
                                                        <td className="p-4 font-black text-indigo-400">{item.sku}</td>
                                                        <td className="p-4 text-slate-400">{item.categoria}</td>
                                                        <td className="p-4 font-bold">{item.producto}</td>
                                                        <td className="p-4 font-black">{item.cantidad}</td>
                                                        <td className="p-4"><span className="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">👤 {item.personal_asignado}</span></td>
                                                        <td className="p-4 text-xs text-slate-400">{item.observaciones || '-'}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
