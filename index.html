<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function Tooltip({ text, children }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative inline-block" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-1.5 bg-slate-900 text-white text-[11px] font-bold rounded-xl shadow-2xl border border-slate-700 whitespace-nowrap z-50 pointer-events-none">
                            {text}
                            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-900"></div>
                        </div>
                    )}
                </div>
            );
        }

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [categoriasList, setCategoriasList] = useState([]);
            const [cargosList, setCargosList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            const [mostrarHistorial, setMostrarHistorial] = useState(false);
            const [paginaActual, setPaginaActual] = useState(1);
            const itemsPorPagina = 6;
            const [darkMode, setDarkMode] = useState(true);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            // Devolución Parcial de Asignaciones
            const [devolviendoId, setDevolviendoId] = useState(null);
            const [cantDevolver, setCantDevolver] = useState(1);

            // Gestores dinámicos para Categorías y Cargos
            const [creandoCategoria, setCreandoCategoria] = useState(false);
            const [nuevaCatNombre, setNuevaCatNombre] = useState('');

            const [creandoCargo, setCreandoCargo] = useState(false);
            const [nuevoCargoNombre, setNuevoCargoNombre] = useState('');

            // Formularios
            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formRestock, setFormRestock] = useState({ sku: '', cantidadExtra: '' });
            const [formEliminarProd, setFormEliminarProd] = useState({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '' });
            const [formAsignacion, setFormAsignacion] = useState({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });

            const mostrarToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: prodData } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('nombre', { ascending: true });
                    const { data: catData } = await supabase.from('categorias').select('*').order('nombre', { ascending: true });
                    const { data: cargoData } = await supabase.from('cargos').select('*').order('nombre', { ascending: true });

                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                    
                    if (catData && catData.length > 0) {
                        setCategoriasList(catData);
                    } else if (prodData) {
                        const unicas = Array.from(new Set(prodData.map(p => p.categoria).filter(Boolean)));
                        setCategoriasList(unicas.map((c, i) => ({ id: i + 1, nombre: c })));
                    }

                    if (cargoData && cargoData.length > 0) {
                        setCargosList(cargoData);
                    } else if (persData) {
                        const unicos = Array.from(new Set(persData.map(p => p.cargo).filter(Boolean)));
                        setCargosList(unicos.map((c, i) => ({ id: i + 1, nombre: c })));
                    }
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const descargarPlantillaCSV = () => {
                const cabecera = ['Categoria', 'Producto', 'Cantidad', 'Observaciones'];
                const ejemplo1 = ['Tecnologia', 'Laptop HP ProBook', '5', 'Stock inicial'];
                const ejemplo2 = ['Oficina', 'Silla Ergonomica', '12', 'Nuevo lote'];
                const csvContent = '\uFEFF' + [cabecera.join(';'), ejemplo1.join(';'), ejemplo2.join(';')].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'plantilla_importacion_productos.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                mostrarToast('Plantilla descargada correctamente.');
            };

            // Importación Masiva con Detección Estricta de Duplicados
            const handleImportarCSV = async (e) => {
                const archivo = e.target.files[0];
                if (!archivo) return;

                const lector = new FileReader();
                lector.onload = async (evento) => {
                    try {
                        const texto = evento.target.result;
                        const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lineas.length < 2) {
                            mostrarToast('El archivo está vacío o no tiene un formato válido.', 'error');
                            return;
                        }

                        const { data: dbProductos } = await supabase.from('productos').select('*');
                        const prodActuales = dbProductos || [];

                        // Mapeo de nombres existentes para validar duplicados
                        const nombresExistentes = new Set(prodActuales.map(p => p.producto.trim().toLowerCase()));

                        let maxSKUNum = 0;
                        prodActuales.forEach(p => {
                            if (p.sku && p.sku.startsWith('PROD-')) {
                                const num = parseInt(p.sku.replace('PROD-', ''), 10);
                                if (!isNaN(num) && num > maxSKUNum) maxSKUNum = num;
                            }
                        });

                        const filas = lineas.slice(1);
                        let importadosCount = 0;
                        const omitidos = [];

                        for (const fila of filas) {
                            const separador = fila.includes(';') ? ';' : ',';
                            const columnas = fila.split(separador).map(c => c.trim().replace(/^["']|["']$/g, ''));
                            if (columnas.length >= 3) {
                                const [categoria, productoNombre, cantidadStr, observaciones = 'Importado masivo'] = columnas;
                                const cantidad = parseInt(cantidadStr, 10);
                                const nombreNormalizado = productoNombre ? productoNombre.trim().toLowerCase() : '';

                                if (productoNombre && !isNaN(cantidad) && cantidad > 0) {
                                    if (nombresExistentes.has(nombreNormalizado)) {
                                        omitidos.push(productoNombre);
                                    } else {
                                        maxSKUNum++;
                                        const nuevoSKU = `PROD-${String(maxSKUNum).padStart(3, '0')}`;

                                        const nuevoProdObj = {
                                            sku: nuevoSKU,
                                            categoria: categoria || 'General',
                                            producto: productoNombre,
                                            cantidad: cantidad,
                                            observaciones: observaciones,
                                            personal_asignado: ''
                                        };

                                        await supabase.from('productos').insert([nuevoProdObj]);
                                        nombresExistentes.add(nombreNormalizado);
                                        importadosCount++;
                                    }
                                }
                            }
                        }

                        await fetchData();
                        if (omitidos.length > 0) {
                            mostrarToast(`Se agregaron ${importadosCount} productos. Omitidos por duplicado: ${omitidos.join(', ')}`, 'error');
                        } else {
                            mostrarToast(`¡Importación exitosa! Se procesaron ${importadosCount} productos con SKUs únicos.`);
                        }
                        e.target.value = '';
                    } catch (err) {
                        console.error(err);
                        mostrarToast('Error al procesar el archivo CSV.', 'error');
                    }
                };
                lector.readAsText(archivo, 'UTF-8');
            };

            const handleGuardarNuevaCategoria = async () => {
                if (!nuevaCatNombre.trim()) return;
                try {
                    const { error } = await supabase.from('categorias').insert([{ nombre: nuevaCatNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Categoría creada exitosamente.');
                        setFormProducto({ ...formProducto, categoria: nuevaCatNombre.trim() });
                        setNuevaCatNombre('');
                        setCreandoCategoria(false);
                        fetchData();
                    } else {
                        mostrarToast('Error al crear la categoría.', 'error');
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleEliminarCategoria = async (idCat, nombreCat) => {
                if (!window.confirm(`¿Eliminar la categoría "${nombreCat}"?`)) return;
                try {
                    const { error } = await supabase.from('categorias').delete().eq('id', idCat);
                    if (!error) {
                        mostrarToast('Categoría eliminada.');
                        if (formProducto.categoria === nombreCat) setFormProducto({ ...formProducto, categoria: '' });
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleGuardarNuevoCargo = async () => {
                if (!nuevoCargoNombre.trim()) return;
                try {
                    const { error } = await supabase.from('cargos').insert([{ nombre: nuevoCargoNombre.trim() }]);
                    if (!error) {
                        mostrarToast('Cargo creado exitosamente.');
                        setFormPersonal({ ...formPersonal, cargo: nuevoCargoNombre.trim() });
                        setNuevoCargoNombre('');
                        setCreandoCargo(false);
                        fetchData();
                    } else {
                        mostrarToast('Error al crear el cargo.', 'error');
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleEliminarCargo = async (idCargo, nombreCargo) => {
                if (!window.confirm(`¿Eliminar el cargo "${nombreCargo}"?`)) return;
                try {
                    const { error } = await supabase.from('cargos').delete().eq('id', idCargo);
                    if (!error) {
                        mostrarToast('Cargo eliminado.');
                        if (formPersonal.cargo === nombreCargo) setFormPersonal({ ...formPersonal, cargo: '' });
                        fetchData();
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const generarSKU = () => {
                const skusExistentes = new Set();
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const num = parseInt(p.sku.replace('PROD-', ''), 10);
                        if (!isNaN(num)) skusExistentes.add(num);
                    }
                });
                let nuevoNum = 1;
                while (skusExistentes.has(nuevoNum)) nuevoNum++;
                return `PROD-${String(nuevoNum).padStart(3, '0')}`;
            };

            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesSinAsignar = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesEnUso = totalUnidades - unidadesSinAsignar;
            const registrosAsignados = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');

            const productosLibresAgrupados = Object.values(
                productos
                    .filter(p => !p.personal_asignado || p.personal_asignado.trim() === '')
                    .reduce((acc, curr) => {
                        if (!acc[curr.sku]) acc[curr.sku] = { ...curr, cantidad: Number(curr.cantidad) || 0 };
                        else acc[curr.sku].cantidad += Number(curr.cantidad) || 0;
                        return acc;
                    }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const productosUnicosList = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku;
                    if (!acc[key]) acc[key] = { sku: curr.sku, producto: curr.producto, cantidadTotal: 0, cantidadLibre: 0, cantidadUso: 0 };
                    const cant = Number(curr.cantidad) || 0;
                    acc[key].cantidadTotal += cant;
                    if (!curr.personal_asignado || curr.personal_asignado.trim() === '') acc[key].cantidadLibre += cant;
                    else acc[key].cantidadUso += cant;
                    return acc;
                }, {})
            ).sort((a, b) => a.sku.localeCompare(b.sku));

            const productoSeleccionadoRestock = productosUnicosList.find(p => p.sku === formRestock.sku);
            const productoSeleccionadoEliminar = productosUnicosList.find(p => p.sku === formEliminarProd.sku);

            const historialAsignaciones = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');
            const historialFiltrado = historialAsignaciones.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            const totalPaginas = Math.ceil(historialFiltrado.length / itemsPorPagina) || 1;
            const productosPaginados = historialFiltrado.slice((paginaActual - 1) * itemsPorPagina, paginaActual * itemsPorPagina);

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                const { error } = await supabase.from('productos').insert([{
                    sku: nuevoSKU,
                    categoria: formProducto.categoria,
                    producto: formProducto.producto,
                    cantidad: Number(formProducto.cantidad),
                    observaciones: formProducto.observaciones,
                    personal_asignado: ''
                }]);
                if (!error) {
                    setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                    fetchData();
                    mostrarToast(`Producto registrado. SKU: ${nuevoSKU}`);
                }
            };

            const handleRestockProducto = async (e) => {
                e.preventDefault();
                if (!formRestock.sku || !formRestock.cantidadExtra || Number(formRestock.cantidadExtra) <= 0) {
                    mostrarToast('Selecciona un producto e ingresa una cantidad válida.', 'error');
                    return;
                }
                try {
                    const cantidadSumar = Number(formRestock.cantidadExtra);
                    const filasLibresMismoSKU = productos.filter(
                        p => p.sku === formRestock.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                    );

                    if (filasLibresMismoSKU.length > 0) {
                        const filaPrincipal = filasLibresMismoSKU[0];
                        const nuevaCant = Number(filaPrincipal.cantidad) + cantidadSumar;
                        await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaPrincipal.id);
                    } else {
                        const refProd = productos.find(p => p.sku === formRestock.sku);
                        await supabase.from('productos').insert([{
                            sku: refProd.sku,
                            categoria: refProd.categoria,
                            producto: refProd.producto,
                            cantidad: cantidadSumar,
                            observaciones: 'Reabastecido',
                            personal_asignado: ''
                        }]);
                    }
                    setFormRestock({ sku: '', cantidadExtra: '' });
                    fetchData();
                    mostrarToast('¡Stock reabastecido correctamente!');
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al reabastecer stock', 'error');
                }
            };

            const handleEliminarProductoPorSKU = async (e) => {
                e.preventDefault();
                if (!formEliminarProd.sku) {
                    mostrarToast('Selecciona un producto para eliminar.', 'error');
                    return;
                }
                const prodRef = productosUnicosList.find(p => p.sku === formEliminarProd.sku);
                const nombreProd = prodRef ? prodRef.producto : formEliminarProd.sku;
                try {
                    if (formEliminarProd.eliminarTodo) {
                        if (!window.confirm(`¿Estás seguro de eliminar COMPLETAMENTE el producto "${nombreProd}" (${formEliminarProd.sku})?`)) return;
                        const { error } = await supabase.from('productos').delete().eq('sku', formEliminarProd.sku);
                        if (!error) {
                            setFormEliminarProd({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
                            fetchData();
                            mostrarToast('Producto eliminado completamente.', 'error');
                        }
                    } else {
                        const cantQuitar = Number(formEliminarProd.cantidadEliminar);
                        if (cantQuitar <= 0) {
                            mostrarToast('Ingresa una cantidad válida.', 'error');
                            return;
                        }
                        const filaLibre = productos.find(p => p.sku === formEliminarProd.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                        if (!filaLibre || Number(filaLibre.cantidad) < cantQuitar) {
                            mostrarToast('No hay suficiente stock libre disponible.', 'error');
                            return;
                        }
                        const nuevaCant = Number(filaLibre.cantidad) - cantQuitar;
                        if (nuevaCant > 0) {
                            await supabase.from('productos').update({ cantidad: nuevaCant }).eq('id', filaLibre.id);
                        } else {
                            await supabase.from('productos').delete().eq('id', filaLibre.id);
                        }
                        setFormEliminarProd({ sku: '', cantidadEliminar: 1, eliminarTodo: false });
                        fetchData();
                        mostrarToast(`Se eliminaron ${cantQuitar} unidades.`);
                    }
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al eliminar', 'error');
                }
            };

            const handleAsignar = async (e) => {
                e.preventDefault();
                const prodOriginal = productos.find(p => p.id == formAsignacion.producto_id);
                if (!prodOriginal) return;
                const cantAsignar = Number(formAsignacion.cantidad_asignada) || 1;

                await supabase.from('productos').insert([{
                    sku: prodOriginal.sku,
                    categoria: prodOriginal.categoria,
                    producto: prodOriginal.producto,
                    cantidad: cantAsignar,
                    observaciones: formAsignacion.observaciones || '',
                    personal_asignado: formAsignacion.personal_nombre
                }]);

                const resto = Number(prodOriginal.cantidad) - cantAsignar;
                if (resto > 0) await supabase.from('productos').update({ cantidad: resto }).eq('id', prodOriginal.id);
                else await supabase.from('productos').delete().eq('id', prodOriginal.id);

                setFormAsignacion({ producto_id: '', personal_nombre: '', cantidad_asignada: 1, observaciones: '' });
                fetchData();
                mostrarToast('Asignación realizada con éxito.');
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                const { error } = await supabase.from('personal').insert([{
                    nombre: formPersonal.nombre,
                    cargo: formPersonal.cargo
                }]);
                if (!error) {
                    setFormPersonal({ nombre: '', cargo: '' });
                    fetchData();
                    mostrarToast('Personal registrado con éxito.');
                }
            };

            // Devolución Flexible (Todas o Cantidades Específicas)
            const handleEjecutarDevolucion = async (asigItem) => {
                const cantADevolver = Number(cantDevolver);
                if (cantADevolver <= 0 || cantADevolver > asigItem.cantidad) {
                    mostrarToast('Ingresa una cantidad válida a devolver.', 'error');
                    return;
                }

                try {
                    const stockLibreExistente = productos.find(p => p.sku === asigItem.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                    if (stockLibreExistente) {
                        await supabase.from('productos').update({ cantidad: Number(stockLibreExistente.cantidad) + cantADevolver }).eq('id', stockLibreExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: asigItem.sku,
                            categoria: asigItem.categoria,
                            producto: asigItem.producto,
                            cantidad: cantADevolver,
                            observaciones: 'Devuelto',
                            personal_asignado: ''
                        }]);
                    }

                    const saldoRestante = asigItem.cantidad - cantADevolver;
                    if (saldoRestante > 0) {
                        await supabase.from('productos').update({ cantidad: saldoRestante }).eq('id', asigItem.id);
                    } else {
                        await supabase.from('productos').delete().eq('id', asigItem.id);
                    }

                    setDevolviendoId(null);
                    setCantDevolver(1);
                    fetchData();
                    mostrarToast(`Se devolvieron ${cantADevolver} unidades al stock libre.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Error al procesar la devolución', 'error');
                }
            };

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Eliminar a "${persNombre}"? Sus equipos volverán a stock libre.`)) return;
                const asignacionesDelPersonal = productos.filter(p => p.personal_asignado === persNombre);
                for (const item of asignacionesDelPersonal) {
                    const stockLibreExistente = productos.find(p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));
                    if (stockLibreExistente) {
                        await supabase.from('productos').update({ cantidad: Number(stockLibreExistente.cantidad) + Number(item.cantidad) }).eq('id', stockLibreExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: item.sku, categoria: item.categoria, producto: item.producto, cantidad: item.cantidad, observaciones: item.observaciones, personal_asignado: ''
                        }]);
                    }
                    await supabase.from('productos').delete().eq('id', item.id);
                }
                await supabase.from('personal').delete().eq('id', persId);
                fetchData();
                mostrarToast('Personal eliminado.');
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} p-6 md:p-8 transition-colors duration-300`}>
                    {toast.show && (
                        <div className={`fixed top-6 right-6 z-50 px-5 py-3.5 rounded-2xl text-xs font-bold shadow-2xl border ${toast.type === 'error' ? 'bg-rose-950 text-rose-300 border-rose-500/40' : 'bg-emerald-950 text-emerald-300 border-emerald-500/40'}`}>
                            {toast.type === 'error' ? '⚠️' : '✨'} {toast.message}
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Cabecera */}
                        <header className={`${darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'} p-6 md:p-8 rounded-3xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-xl`}>
                            <div className="flex items-center gap-5">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-700 flex items-center justify-center text-2xl text-white shadow-lg">🏢</div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-black">Cordero y Asociados</h1>
                                    <p className="text-xs text-slate-400 font-semibold">Sistema de Inventario Modular • Base de Datos Sincronizada</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <Tooltip text={mostrarHistorial ? "Ocultar Historial" : "Ver Historial de Asignaciones"}>
                                    <button onClick={() => setMostrarHistorial(!mostrarHistorial)} className="p-3.5 rounded-2xl font-black text-xs bg-indigo-600 text-white shadow-lg cursor-pointer flex items-center gap-2">
                                        📜 <span>{mostrarHistorial ? 'Ocultar Historial' : 'Historial'}</span>
                                    </button>
                                </Tooltip>
                                <Tooltip text="Alternar Modo Claro / Oscuro">
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-3.5 rounded-2xl font-black text-xs bg-slate-800 text-amber-400 border border-slate-700 cursor-pointer">
                                        {darkMode ? '☀️' : '🌙'}
                                    </button>
                                </Tooltip>
                            </div>
                        </header>

                        {/* Tarjetas de Métricas */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('total'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800 hover:border-indigo-500' : 'bg-white border-slate-200 hover:border-indigo-400'} p-6 rounded-3xl border shadow-lg cursor-pointer transition-all hover:-translate-y-1 flex items-center justify-between`}>
                                <div className="space-y-2">
                                    <span className="block text-xs font-black uppercase text-slate-400">Estado general del Stock</span>
                                    <div className="flex items-baseline gap-3">
                                        <span className="text-4xl font-black text-indigo-400">{totalUnidades}</span>
                                        <span className="text-xs font-bold text-slate-400">Total Unidades</span>
                                    </div>
                                    <div className="flex gap-2 text-xs font-bold pt-1">
                                        <span className="text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">🟢 {unidadesSinAsignar} Libres</span>
                                        <span className="text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20">🏷️ {unidadesEnUso} En Uso</span>
                                    </div>
                                </div>
                                <div className="p-4 rounded-2xl bg-indigo-950 text-indigo-400 text-2xl">📦</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('personal'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800 hover:border-amber-500' : 'bg-white border-slate-200 hover:border-amber-400'} p-6 rounded-3xl border shadow-lg cursor-pointer transition-all hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className="block text-xs font-black uppercase mb-1 text-slate-400">Total Personal</span>
                                    <span className="text-3xl font-black text-amber-400">{personalList.length}</span>
                                </div>
                                <div className="p-4 rounded-2xl bg-amber-950 text-amber-400 text-2xl">👥</div>
                            </div>

                            <div onClick={() => { setModalAbierto(true); setSeccionSeleccionada('asignaciones'); }} className={`${darkMode ? 'bg-slate-900/70 border-slate-800 hover:border-purple-500' : 'bg-white border-slate-200 hover:border-purple-400'} p-6 rounded-3xl border shadow-lg cursor-pointer transition-all hover:-translate-y-1 flex items-center justify-between`}>
                                <div>
                                    <span className="block text-xs font-black uppercase mb-1 text-slate-400">Asignaciones Activas</span>
                                    <span className="text-3xl font-black text-purple-400">{registrosAsignados.length}</span>
                                </div>
                                <div className="p-4 rounded-2xl bg-purple-950 text-purple-400 text-2xl">🏷️</div>
                            </div>
                        </div>

                        {/* Pestañas Principales */}
                        <div className={`flex gap-3 ${darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'} p-2.5 rounded-3xl border shadow-lg`}>
                            <button onClick={() => setTabActiva('asignar')} className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm cursor-pointer ${tabActiva === 'asignar' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>🔗 Asignar Productos</button>
                            <button onClick={() => setTabActiva('productos')} className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm cursor-pointer ${tabActiva === 'productos' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>📦 Gestionar e Importar Stock</button>
                            <button onClick={() => setTabActiva('personal')} className={`flex-1 py-4 px-5 rounded-2xl font-extrabold text-sm cursor-pointer ${tabActiva === 'personal' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>👥 Agregar Personal</button>
                        </div>

                        {/* Módulo de Gestión de Productos y Stock */}
                        {tabActiva === 'productos' && (
                            <div className="space-y-6">
                                {/* Bloque Importación Masiva */}
                                <section className={`${darkMode ? 'bg-gradient-to-r from-indigo-950/40 via-slate-900/90 to-purple-950/40 border-indigo-500/30 text-slate-100' : 'bg-gradient-to-r from-indigo-50 via-white to-purple-50 border-indigo-200 text-slate-800'} p-8 rounded-3xl border space-y-4 shadow-xl`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-xl font-black flex items-center gap-3">
                                                <span className="p-2.5 rounded-xl bg-indigo-500/20 text-indigo-400">📊</span> Importación Masiva (Control Antiduplicados)
                                            </h2>
                                            <p className={`text-xs mt-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Los productos con nombres idénticos existentes no serán duplicados en la base de datos.</p>
                                        </div>
                                        <button onClick={descargarPlantillaCSV} className="px-5 py-3 rounded-2xl font-extrabold text-xs bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg cursor-pointer flex items-center gap-2">
                                            <span>📥</span> Descargar Plantilla CSV
                                        </button>
                                    </div>
                                    <div className={`p-6 rounded-2xl border border-dashed flex flex-col sm:flex-row items-center justify-between gap-4 ${darkMode ? 'border-slate-700 bg-slate-950/40' : 'border-slate-300 bg-white/60'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">📂</span>
                                            <div>
                                                <p className={`text-xs font-bold ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>Selecciona tu archivo CSV</p>
                                                <p className={`text-[11px] ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>Estructura: Categoria; Producto; Cantidad; Observaciones</p>
                                            </div>
                                        </div>
                                        <input type="file" accept=".csv" onChange={handleImportarCSV} className={`text-xs font-semibold file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:cursor-pointer transition ${darkMode ? 'text-slate-400 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700' : 'text-slate-600 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100'}`} />
                                    </div>
                                </section>

                                {/* Grid con 3 Tarjetas de Operación de Stock */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* 1. Registrar Nuevo Producto */}
                                    <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'} p-8 rounded-3xl border space-y-6 shadow-2xl`}>
                                        <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">📦</span> Registrar Producto</h2>
                                        <form onSubmit={handleSaveProducto} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">SKU Autogenerado</label>
                                                <input type="text" value={generarSKU()} disabled className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-black ${darkMode ? 'bg-slate-800/90 border-slate-700 text-indigo-400' : 'bg-slate-100 border-slate-300 text-slate-500'}`} />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Categoría</label>
                                                {!creandoCategoria ? (
                                                    <div className="flex gap-2">
                                                        <select value={formProducto.categoria} onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                            <option value="">-- Categ. --</option>
                                                            {categoriasList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                        </select>
                                                        <button type="button" onClick={() => setCreandoCategoria(true)} className="px-3 bg-indigo-600 text-white rounded-2xl text-xs font-extrabold cursor-pointer">+</button>
                                                    </div>
                                                ) : (
                                                    <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                        <div className="flex gap-2">
                                                            <input type="text" placeholder="Categoría..." value={nuevaCatNombre} onChange={e => setNuevaCatNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-2 text-xs text-white" />
                                                            <button type="button" onClick={handleGuardarNuevaCategoria} className="px-3 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">OK</button>
                                                            <button type="button" onClick={() => setCreandoCategoria(false)} className="px-3 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">✕</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Producto</label>
                                                <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cantidad Inicial</label>
                                                <input type="number" min="1" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 text-white font-extrabold py-3.5 rounded-2xl shadow-lg cursor-pointer">Guardar Producto</button>
                                        </form>
                                    </section>

                                    {/* 2. Reabastecer Stock */}
                                    <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'} p-8 rounded-3xl border space-y-6 shadow-2xl`}>
                                        <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-500">➕</span> Reabastecer Stock</h2>
                                        <form onSubmit={handleRestockProducto} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Seleccionar Producto</label>
                                                <select value={formRestock.sku} onChange={e => setFormRestock({...formRestock, sku: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Elige producto --</option>
                                                    {productosUnicosList.map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                </select>
                                            </div>

                                            {productoSeleccionadoRestock && (
                                                <div className="p-3.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex justify-between items-center text-xs font-extrabold">
                                                    <span className="text-emerald-400">📦 Stock Total Actual:</span>
                                                    <span className="bg-emerald-600 text-white px-3 py-1 rounded-xl">{productoSeleccionadoRestock.cantidadTotal} unidades</span>
                                                </div>
                                            )}

                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Unidades a Sumar</label>
                                                <input type="number" min="1" placeholder="Ej. 10" value={formRestock.cantidadExtra} onChange={e => setFormRestock({...formRestock, cantidadExtra: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                            </div>
                                            <div className="pt-2">
                                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 px-8 rounded-2xl transition-all shadow-lg cursor-pointer">Sumar Stock</button>
                                            </div>
                                        </form>
                                    </section>

                                    {/* 3. Eliminar Unidades */}
                                    <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'} p-8 rounded-3xl border space-y-6 shadow-2xl`}>
                                        <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-rose-500/10 text-rose-500">🗑️</span> Eliminar Unidades</h2>
                                        <form onSubmit={handleEliminarProductoPorSKU} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-black uppercase mb-2 text-slate-400">Seleccionar Producto</label>
                                                <select value={formEliminarProd.sku} onChange={e => setFormEliminarProd({...formEliminarProd, sku: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Elige producto --</option>
                                                    {productosUnicosList.map(item => <option key={item.sku} value={item.sku}>{item.sku} - {item.producto}</option>)}
                                                </select>
                                            </div>

                                            {productoSeleccionadoEliminar && (
                                                <div className="p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex justify-between items-center text-xs font-extrabold">
                                                    <span className="text-rose-400">🟢 Stock Libre Disponible:</span>
                                                    <span className="bg-rose-600 text-white px-3 py-1 rounded-xl">{productoSeleccionadoEliminar.cantidadLibre} unidades libres</span>
                                                </div>
                                            )}

                                            {!formEliminarProd.eliminarTodo && (
                                                <div>
                                                    <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cantidad a Eliminar</label>
                                                    <input type="number" min="1" value={formEliminarProd.cantidadEliminar} onChange={e => setFormEliminarProd({...formEliminarProd, cantidadEliminar: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                                </div>
                                            )}
                                            <div className="flex items-center gap-2 pt-1">
                                                <input type="checkbox" id="eliminarTodo" checked={formEliminarProd.eliminarTodo} onChange={e => setFormEliminarProd({...formEliminarProd, eliminarTodo: e.target.checked})} className="w-4 h-4 accent-rose-600 rounded cursor-pointer" />
                                                <label htmlFor="eliminarTodo" className="text-xs font-bold cursor-pointer text-slate-300">Eliminar producto completo</label>
                                            </div>
                                            <div className="pt-2">
                                                <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-3.5 px-8 rounded-2xl transition-all shadow-lg cursor-pointer">Ejecutar Eliminación</button>
                                            </div>
                                        </form>
                                    </section>
                                </div>
                            </div>
                        )}

                        {/* Asignar Stock */}
                        {tabActiva === 'asignar' && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'} p-8 rounded-3xl border space-y-6 shadow-2xl`}>
                                <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">🔗</span> Asignar Stock a Personal</h2>
                                <form onSubmit={handleAsignar} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                                    <select value={formAsignacion.producto_id} onChange={e => setFormAsignacion({...formAsignacion, producto_id: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                        <option value="">-- Elige Producto --</option>
                                        {productosLibresAgrupados.map(p => <option key={p.id} value={p.id}>{p.sku} - {p.producto} ({p.cantidad} libres)</option>)}
                                    </select>
                                    <select value={formAsignacion.personal_nombre} onChange={e => setFormAsignacion({...formAsignacion, personal_nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                        <option value="">-- Elige Personal --</option>
                                        {personalList.map(pers => <option key={pers.id} value={pers.nombre}>{pers.nombre} ({pers.cargo || 'Sin cargo'})</option>)}
                                    </select>
                                    <input type="number" min="1" value={formAsignacion.cantidad_asignada} onChange={e => setFormAsignacion({...formAsignacion, cantidad_asignada: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    <input type="text" placeholder="Observaciones..." value={formAsignacion.observaciones} onChange={e => setFormAsignacion({...formAsignacion, observaciones: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} />
                                    <button type="submit" className="sm:col-span-2 lg:col-span-4 bg-indigo-600 text-white font-extrabold py-3.5 rounded-2xl shadow-lg cursor-pointer">Confirmar Asignación</button>
                                </form>
                            </section>
                        )}

                        {/* Agregar Personal */}
                        {tabActiva === 'personal' && (
                            <section className={`${darkMode ? 'bg-slate-900/90 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'} p-8 rounded-3xl border space-y-6 shadow-2xl`}>
                                <h2 className="text-xl font-black flex items-center gap-3"><span className="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-500">👥</span> Agregar Nuevo Personal</h2>
                                <form onSubmit={handleSavePersonal} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase mb-2 text-slate-400">Cargo</label>
                                        {!creandoCargo ? (
                                            <div className="flex gap-2">
                                                <select value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-semibold outline-none ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`} required>
                                                    <option value="">-- Seleccionar Cargo --</option>
                                                    {cargosList.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                                                </select>
                                                <button type="button" onClick={() => setCreandoCargo(true)} className="px-5 py-3.5 bg-indigo-600 text-white rounded-2xl text-xs font-extrabold whitespace-nowrap cursor-pointer">+ Gestionar Cargos</button>
                                            </div>
                                        ) : (
                                            <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="Escribe nuevo cargo..." value={nuevoCargoNombre} onChange={e => setNuevoCargoNombre(e.target.value)} className="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                    <button type="button" onClick={handleGuardarNuevoCargo} className="px-4 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">Guardar</button>
                                                    <button type="button" onClick={() => setCreandoCargo(false)} className="px-4 bg-slate-700 text-slate-300 rounded-xl text-xs font-extrabold cursor-pointer">Cerrar</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white font-extrabold py-3.5 rounded-2xl shadow-lg cursor-pointer">Guardar Colaborador</button>
                                </form>
                            </section>
                        )}

                        {/* Historial Exclusivo de Asignaciones */}
                        {mostrarHistorial && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} rounded-3xl border overflow-hidden shadow-2xl`}>
                                <div className="p-6 border-b border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h2 className="text-xl font-black">📜 Historial Exclusivo de Asignaciones</h2>
                                        <p className="text-xs text-slate-400">Mostrando productos asignados actualmente a colaboradores</p>
                                    </div>
                                    <div className="w-full sm:w-auto">
                                        <input type="text" placeholder="🔍 Buscar..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="w-full sm:w-64 bg-slate-800 border-slate-700 rounded-2xl px-4 py-2 text-sm text-white" />
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-950 text-slate-400 text-xs font-black uppercase border-b border-slate-800">
                                                <th className="p-4">SKU</th>
                                                <th className="p-4">Categoría</th>
                                                <th className="p-4">Producto</th>
                                                <th className="p-4">Cantidad</th>
                                                <th className="p-4">Asignado A</th>
                                                <th className="p-4">Observación</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800 text-sm">
                                            {productosPaginados.length === 0 ? (
                                                <tr><td colSpan="6" className="p-8 text-center text-slate-500 font-bold">No hay asignaciones registradas para mostrar.</td></tr>
                                            ) : (
                                                productosPaginados.map(item => (
                                                    <tr key={item.id} className="hover:bg-indigo-950/20">
                                                        <td className="p-4 font-black text-indigo-400">{item.sku}</td>
                                                        <td className="p-4 text-slate-400">{item.categoria}</td>
                                                        <td className="p-4 font-bold text-white">{item.producto}</td>
                                                        <td className="p-4 font-black">{item.cantidad}</td>
                                                        <td className="p-4"><span className="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold">👤 {item.personal_asignado}</span></td>
                                                        <td className="p-4 text-xs text-slate-400">{item.observaciones || '-'}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* Modal Interactivo con Selección de Devolución Parcial/Total */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'} rounded-3xl border max-w-2xl w-full p-8 space-y-6 max-h-[90vh] overflow-y-auto`}>
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-5">
                                        <h3 className="text-xl font-black">📋 Detalle del Inventario</h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className="text-sm font-black px-4 py-2 bg-slate-800 text-slate-300 rounded-xl cursor-pointer">✕ Cerrar</button>
                                    </div>
                                    {seccionSeleccionada && (
                                        <div className="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-4">
                                            <h4 className="font-black text-xs uppercase tracking-widest text-indigo-400">Filtrado por: {seccionSeleccionada.toUpperCase()}</h4>
                                            <div className="max-h-60 overflow-y-auto space-y-2.5 pr-1">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl flex justify-between items-center text-sm font-semibold">
                                                            <span>👤 <strong>{p.nombre}</strong> ({p.cargo || 'Sin cargo'})</span>
                                                            <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 font-black hover:underline cursor-pointer">Eliminar</button>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosUnicosList.map((item, idx) => (
                                                        <div key={idx} className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl text-sm font-semibold flex justify-between items-center">
                                                            <span>📦 {item.producto} ({item.sku})</span>
                                                            <div className="flex gap-2 text-xs font-black">
                                                                <span className="bg-indigo-950 text-indigo-400 px-2.5 py-1 rounded-xl border border-indigo-900">Total: {item.cantidadTotal}</span>
                                                                <span className="bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-xl border border-emerald-900">Libres: {item.cantidadLibre}</span>
                                                                <span className="bg-amber-950 text-amber-400 px-2.5 py-1 rounded-xl border border-amber-900">En Uso: {item.cantidadUso}</span>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    registrosAsignados.map(asigItem => (
                                                        <div key={asigItem.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-sm space-y-3">
                                                            <div className="flex justify-between items-center">
                                                                <div>
                                                                    <div className="font-black text-purple-400">🏷️ {asigItem.producto} ({asigItem.sku})</div>
                                                                    <div className="text-xs text-slate-300">👤 <strong>{asigItem.personal_asignado}</strong> — Cant: <strong>{asigItem.cantidad}</strong></div>
                                                                </div>
                                                                <button onClick={() => { setDevolviendoId(asigItem.id); setCantDevolver(1); }} className="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 cursor-pointer">Devolver a Stock</button>
                                                            </div>

                                                            {devolviendoId === asigItem.id && (
                                                                <div className="pt-3 border-t border-slate-800 flex items-center justify-between gap-3">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-xs text-slate-400 font-bold">Cantidad a devolver:</span>
                                                                        <input 
                                                                            type="number" 
                                                                            min="1" 
                                                                            max={asigItem.cantidad} 
                                                                            value={cantDevolver} 
                                                                            onChange={e => setCantDevolver(e.target.value)} 
                                                                            className="w-16 px-2 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-black text-white text-center" 
                                                                        />
                                                                        <span className="text-xs text-slate-500 font-semibold">(Max: {asigItem.cantidad})</span>
                                                                    </div>
                                                                    <div className="flex items-center gap-2">
                                                                        <button onClick={() => handleEjecutarDevolucion(asigItem)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black hover:bg-emerald-700 cursor-pointer">Confirmar</button>
                                                                        <button onClick={() => setDevolviendoId(null)} className="px-3 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-black cursor-pointer">Cancelar</button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
