<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario y Asignaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            
            const [formData, setFormData] = useState({
                sku: '',
                categoria: '',
                producto: '',
                cantidad: '',
                personal_asignado: '',
                observaciones: ''
            });

            const fetchRecords = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('productos')
                        .select('*')
                        .order('id', { ascending: false });

                    if (!error) {
                        setProductos(data || []);
                    }
                } catch (error) {
                    console.error('Error al cargar inventario:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchRecords();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('productos').insert([{
                        sku: formData.sku,
                        categoria: formData.categoria,
                        producto: formData.producto,
                        cantidad: Number(formData.cantidad),
                        personal_asignado: formData.personal_asignado,
                        observaciones: formData.observaciones
                    }]);

                    if (!error) {
                        setFormData({ sku: '', categoria: '', producto: '', cantidad: '', personal_asignado: '', observaciones: '' });
                        fetchRecords();
                        alert('¡Producto registrado con éxito!');
                    } else {
                        alert('Error al registrar: ' + error.message);
                    }
                } catch (error) {
                    console.error('Error de red:', error);
                }
            };

            const handleDelete = async (id) => {
                if (!window.confirm('¿Seguro que deseas eliminar este registro?')) return;
                try {
                    const { error } = await supabase.from('productos').delete().eq('id', id);
                    if (!error) fetchRecords();
                } catch (error) {
                    console.error('Error al eliminar:', error);
                }
            };

            // Filtrar productos
            const productosFiltrados = productos.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            // Estadísticas generales
            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesAsignadas = productos
                .filter(item => item.personal_asignado && item.personal_asignado.trim() !== '')
                .reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesSinAsignar = productos
                .filter(item => !item.personal_asignado || item.personal_asignado.trim() === '')
                .reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);

            // Calcular total de personal único (separando por comas si hay varios nombres en un registro)
            const personalSet = new Set();
            productos.forEach(item => {
                if (item.personal_asignado && item.personal_asignado.trim() !== '') {
                    item.personal_asignado.split(',').forEach(p => {
                        const nombreLimpio = p.trim();
                        if (nombreLimpio) personalSet.add(nombreLimpio.toLowerCase());
                    });
                }
            });
            const totalPersonalUnico = personalSet.size;

            // Total de registros que tienen una asignación activa
            const totalAsignacionesRegistros = productos.filter(item => item.personal_asignado && item.personal_asignado.trim() !== '').length;

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* Cabecera con Botón de Detalle de Oficina */}
                        <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900">Control de Inventario y Asignaciones</h1>
                                <p className="text-sm text-slate-500">Gestión de recursos y disponibilidad en oficina</p>
                            </div>
                            <div>
                                <button 
                                    onClick={() => setModalAbierto(true)}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition duration-200 shadow-sm flex items-center gap-2"
                                >
                                    <span>📊</span> Ver Detalle de Oficina
                                </button>
                            </div>
                        </header>

                        {/* Modal / Panel Detallado de Oficina */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-lg w-full p-6 space-y-6 animate-in fade-in zoom-in duration-200">
                                    <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                                        <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                            <span>📋</span> Resumen Detallado de la Oficina
                                        </h3>
                                        <button 
                                            onClick={() => setModalAbierto(false)}
                                            className="text-slate-400 hover:text-slate-600 text-sm font-bold bg-slate-100 px-3 py-1 rounded-lg"
                                        >
                                            ✕ Cerrar
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-center">
                                            <span className="block text-xs text-indigo-500 font-semibold uppercase mb-1">Total Unidades Oficina</span>
                                            <span className="text-2xl font-bold text-indigo-700">{totalUnidades}</span>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-center">
                                            <span className="block text-xs text-emerald-500 font-semibold uppercase mb-1">Unidades Libres</span>
                                            <span className="text-2xl font-bold text-emerald-700">{unidadesSinAsignar}</span>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-100 p-4 rounded-xl text-center">
                                            <span className="block text-xs text-amber-500 font-semibold uppercase mb-1">Total Personal con Equipo</span>
                                            <span className="text-2xl font-bold text-amber-700">{totalPersonalUnico}</span>
                                        </div>
                                        <div className="bg-purple-50 border border-purple-100 p-4 rounded-xl text-center">
                                            <span className="block text-xs text-purple-500 font-semibold uppercase mb-1">Asignaciones Activas</span>
                                            <span className="text-2xl font-bold text-purple-700">{totalAsignacionesRegistros}</span>
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <button 
                                            onClick={() => setModalAbierto(false)}
                                            className="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl transition"
                                        >
                                            Entendido
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Apartado 1: Formulario de Registro */}
                        <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span>➕</span> Registrar Nuevo Producto y Asignación
                            </h2>
                            <form onSubmit={handleSubmit} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Código SKU</label>
                                    <input type="text" placeholder="Ej. PROD-015" value={formData.sku} onChange={e => setFormData({...formData, sku: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                                    <input type="text" placeholder="Ej. Cómputo / Periféricos" value={formData.categoria} onChange={e => setFormData({...formData, categoria: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Nombre del Producto</label>
                                    <input type="text" placeholder="Ej. Monitor curvo 27 pulgadas" value={formData.producto} onChange={e => setFormData({...formData, producto: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Cantidad</label>
                                    <input type="number" placeholder="Ej. 2" value={formData.cantidad} onChange={e => setFormData({...formData, cantidad: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Personal Asignado (Opcional)</label>
                                    <input type="text" placeholder="Ej. Jose, Ana (Dejar vacío si está libre)" value={formData.personal_asignado} onChange={e => setFormData({...formData, personal_asignado: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-indigo-600 font-medium" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Observaciones</label>
                                    <input type="text" placeholder="Ej. Oficina principal / Piso 2" value={formData.observaciones} onChange={e => setFormData({...formData, observaciones: e.target.value})} className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                </div>
                                <div className="sm:col-span-2 lg:col-span-3 flex justify-end mt-2">
                                    <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-xl transition duration-200 shadow-sm w-full sm:w-auto">
                                        Guardar Registro
                                    </button>
                                </div>
                            </form>
                        </section>

                        {/* Apartado 2: Vista General y Asignaciones */}
                        <section className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>
                                    <h2 className="text-lg font-semibold text-slate-800">📦 Listado General de Inventario</h2>
                                    <p className="text-xs text-slate-400 mt-0.5">Vista detallada de los productos y a quién se encuentran asignados</p>
                                </div>
                                <div className="w-full sm:w-72">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 Buscar por producto, personal..." 
                                        value={busqueda} 
                                        onChange={e => setBusqueda(e.target.value)} 
                                        className="w-full border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50" 
                                    />
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                            <th className="p-4 font-semibold">SKU</th>
                                            <th className="p-4 font-semibold">Categoría</th>
                                            <th className="p-4 font-semibold">Producto</th>
                                            <th className="p-4 font-semibold">Cantidad</th>
                                            <th className="p-4 font-semibold">Personal Asignado</th>
                                            <th className="p-4 font-semibold">Observaciones</th>
                                            <th className="p-4 font-semibold text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {loading ? (
                                            <tr><td colSpan="7" className="p-8 text-center text-slate-400">Cargando registros...</td></tr>
                                        ) : productosFiltrados.length === 0 ? (
                                            <tr><td colSpan="7" className="p-8 text-center text-slate-400">No se encontraron productos.</td></tr>
                                        ) : (
                                            productosFiltrados.map((item) => (
                                                <tr key={item.id} className="hover:bg-slate-50/50 transition">
                                                    <td className="p-4 font-medium text-slate-700">{item.sku || '-'}</td>
                                                    <td className="p-4 text-slate-600">{item.categoria || '-'}</td>
                                                    <td className="p-4 text-slate-900 font-semibold">{item.producto || '-'}</td>
                                                    <td className="p-4 text-slate-700 font-medium">{item.cantidad || 0}</td>
                                                    <td className="p-4">
                                                        {item.personal_asignado && item.personal_asignado.trim() !== '' ? (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200">
                                                                {item.personal_asignado}
                                                            </span>
                                                        ) : (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                                                                Disponible (Sin asignar)
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-slate-500 text-xs">{item.observaciones || '-'}</td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => handleDelete(item.id)} className="px-3 py-1.5 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition font-medium">
                                                            Eliminar
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
