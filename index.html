<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordero y Asociados - Control de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://oceaobdjhbnrusparxvp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GRoHl1gsQ9Ploya6veF_EA_VRtfQb73';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function InventoryApp() {
            const [productos, setProductos] = useState([]);
            const [personalList, setPersonalList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [modalAbierto, setModalAbierto] = useState(false);
            const [seccionSeleccionada, setSeccionSeleccionada] = useState(null);
            const [tabActiva, setTabActiva] = useState('asignar');
            
            const [darkMode, setDarkMode] = useState(true);

            const [itemEditando, setItemEditando] = useState(null);
            const [cantidadOriginal, setCantidadOriginal] = useState(0);
            const [personalEditando, setPersonalEditando] = useState(null);

            const [formProducto, setFormProducto] = useState({ categoria: '', producto: '', cantidad: '', observaciones: '' });
            const [formPersonal, setFormPersonal] = useState({ nombre: '', cargo: '', area: '' });
            const [formAsignacion, setFormAsignacion] = useState({ producto_id: '', personal_nombre: '', cantidad_asignada: 1 });

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: prodData } = await supabase.from('productos').select('*').order('id', { ascending: false });
                    const { data: persData } = await supabase.from('personal').select('*').order('id', { ascending: false });
                    
                    setProductos(prodData || []);
                    setPersonalList(persData || []);
                } catch (error) {
                    console.error('Error al cargar datos:', error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const generarSKU = () => {
                if (!productos || productos.length === 0) return 'PROD-001';
                let maxNum = 0;
                productos.forEach(p => {
                    if (p.sku && p.sku.startsWith('PROD-')) {
                        const numStr = p.sku.replace('PROD-', '');
                        const num = parseInt(numStr, 10);
                        if (!isNaN(num) && num > maxNum) maxNum = num;
                    }
                });
                return `PROD-${String(maxNum + 1).padStart(3, '0')}`;
            };

            const categoriasUnicas = Array.from(new Set(productos.map(p => p.categoria).filter(Boolean)));

            const handleSaveProducto = async (e) => {
                e.preventDefault();
                const nuevoSKU = generarSKU();
                try {
                    const { error } = await supabase.from('productos').insert([{
                        sku: nuevoSKU,
                        categoria: formProducto.categoria,
                        producto: formProducto.producto,
                        cantidad: Number(formProducto.cantidad),
                        observaciones: formProducto.observaciones,
                        personal_asignado: ''
                    }]);

                    if (!error) {
                        setFormProducto({ categoria: '', producto: '', cantidad: '', observaciones: '' });
                        fetchData();
                        alert(`¡Producto registrado con éxito! SKU: ${nuevoSKU}`);
                    } else {
                        alert('Error: ' + error.message);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleSavePersonal = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('personal').insert([{
                        nombre: formPersonal.nombre,
                        cargo: formPersonal.cargo,
                        area: formPersonal.area
                    }]);

                    if (!error) {
                        setFormPersonal({ nombre: '', cargo: '', area: '' });
                        fetchData();
                        alert('¡Personal registrado con éxito!');
                    } else {
                        alert('Error: ' + error.message);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleAsignar = async (e) => {
                e.preventDefault();
                if (!formAsignacion.producto_id || !formAsignacion.personal_nombre) {
                    alert('Selecciona un producto libre y un miembro del personal.');
                    return;
                }

                const prodOriginal = productos.find(p => p.id == formAsignacion.producto_id);
                if (!prodOriginal) return;

                const cantAsignar = Number(formAsignacion.cantidad_asignada) || 1;
                if (cantAsignar > Number(prodOriginal.cantidad)) {
                    alert('No puedes asignar más cantidad de la disponible en stock.');
                    return;
                }

                try {
                    const asignacionExistente = productos.find(
                        p => p.sku === prodOriginal.sku && p.personal_asignado === formAsignacion.personal_nombre
                    );

                    if (asignacionExistente) {
                        const nuevaCantidadAsignada = Number(asignacionExistente.cantidad) + cantAsignar;
                        await supabase.from('productos')
                            .update({ cantidad: nuevaCantidadAsignada })
                            .eq('id', asignacionExistente.id);
                    } else {
                        await supabase.from('productos').insert([{
                            sku: prodOriginal.sku,
                            categoria: prodOriginal.categoria,
                            producto: prodOriginal.producto,
                            cantidad: cantAsignar,
                            observaciones: prodOriginal.observaciones || '',
                            personal_asignado: formAsignacion.personal_nombre
                        }]);
                    }

                    const resto = Number(prodOriginal.cantidad) - cantAsignar;
                    if (resto > 0) {
                        await supabase.from('productos').update({ cantidad: resto }).eq('id', prodOriginal.id);
                    } else {
                        await supabase.from('productos').delete().eq('id', prodOriginal.id);
                    }

                    setFormAsignacion({ producto_id: '', personal_nombre: '', cantidad_asignada: 1 });
                    fetchData();
                    alert('¡Asignación realizada con éxito!');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleEliminarRegistro = async (item) => {
                if (!window.confirm('¿Deseas eliminar este registro? Si tiene personal asignado, las unidades volverán a estar disponibles.')) return;

                try {
                    if (item.personal_asignado && item.personal_asignado.trim() !== '') {
                        const stockLibreExistente = productos.find(p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (stockLibreExistente) {
                            const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(item.cantidad);
                            await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku,
                                categoria: item.categoria,
                                producto: item.producto,
                                cantidad: item.cantidad,
                                observaciones: item.observaciones,
                                personal_asignado: ''
                            }]);
                        }
                    }

                    await supabase.from('productos').delete().eq('id', item.id);
                    fetchData();
                } catch (err) {
                    console.error(err);
                }
            };

            const handleGuardarEdicion = async (e) => {
                e.preventDefault();
                try {
                    const nuevaCantidad = Number(itemEditando.cantidad);
                    const diferencia = nuevaCantidad - cantidadOriginal;

                    if (itemEditando.personal_asignado && itemEditando.personal_asignado.trim() !== '' && diferencia !== 0) {
                        const stockLibre = productos.find(p => p.sku === itemEditando.sku && (!p.personal_asignado || p.personal_asignado.trim() === ''));

                        if (diferencia > 0) {
                            if (!stockLibre || Number(stockLibre.cantidad) < diferencia) {
                                alert('No hay suficiente stock libre disponible para aumentar esta asignación.');
                                return;
                            }
                            const nuevoStockLibre = Number(stockLibre.cantidad) - diferencia;
                            if (nuevoStockLibre > 0) {
                                await supabase.from('productos').update({ cantidad: nuevoStockLibre }).eq('id', stockLibre.id);
                            } else {
                                await supabase.from('productos').delete().eq('id', stockLibre.id);
                            }
                        } else {
                            const diffPositiva = Math.abs(diferencia);
                            if (stockLibre) {
                                await supabase.from('productos').update({ cantidad: Number(stockLibre.cantidad) + diffPositiva }).eq('id', stockLibre.id);
                            } else {
                                await supabase.from('productos').insert([{
                                    sku: itemEditando.sku,
                                    categoria: itemEditando.categoria,
                                    producto: itemEditando.producto,
                                    cantidad: diffPositiva,
                                    observaciones: itemEditando.observaciones,
                                    personal_asignado: ''
                                }]);
                            }
                        }
                    }

                    await supabase.from('productos').update({
                        cantidad: nuevaCantidad,
                        personal_asignado: itemEditando.personal_asignado,
                        observaciones: itemEditando.observaciones
                    }).eq('id', itemEditando.id);

                    setItemEditando(null);
                    fetchData();
                    alert('¡Cambios guardados y stock sincronizado con éxito!');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleGuardarPersonalEdicion = async (e) => {
                e.preventDefault();
                try {
                    const nombreAntiguo = personalEditando.nombreAntiguo;
                    const nombreNuevo = personalEditando.nombre;

                    await supabase.from('personal').update({
                        nombre: personalEditando.nombre,
                        cargo: personalEditando.cargo,
                        area: personalEditando.area
                    }).eq('id', personalEditando.id);

                    if (nombreAntiguo !== nombreNuevo) {
                        const asignaciones = productos.filter(p => p.personal_asignado === nombreAntiguo);
                        for (const asig of asignaciones) {
                            await supabase.from('productos').update({ personal_asignado: nombreNuevo }).eq('id', asig.id);
                        }
                    }

                    setPersonalEditando(null);
                    fetchData();
                    alert('¡Personal actualizado con éxito!');
                } catch (err) {
                    console.error(err);
                    alert('Error al actualizar el personal.');
                }
            };

            const handleDeletePersonal = async (persId, persNombre) => {
                if (!window.confirm(`¿Estás seguro de eliminar a "${persNombre}"? Todos sus equipos asignados volverán a estar disponibles (libres) en el inventario.`)) return;

                try {
                    const asignacionesDelPersonal = productos.filter(p => p.personal_asignado === persNombre);

                    for (const item of asignacionesDelPersonal) {
                        const stockLibreExistente = productos.find(
                            p => p.sku === item.sku && (!p.personal_asignado || p.personal_asignado.trim() === '')
                        );

                        if (stockLibreExistente) {
                            const nuevaCantidad = Number(stockLibreExistente.cantidad) + Number(item.cantidad);
                            await supabase.from('productos').update({ cantidad: nuevaCantidad }).eq('id', stockLibreExistente.id);
                        } else {
                            await supabase.from('productos').insert([{
                                sku: item.sku,
                                categoria: item.categoria,
                                producto: item.producto,
                                cantidad: item.cantidad,
                                observaciones: item.observaciones,
                                personal_asignado: ''
                            }]);
                        }

                        await supabase.from('productos').delete().eq('id', item.id);
                    }

                    await supabase.from('personal').delete().eq('id', persId);

                    fetchData();
                    alert(`Personal "${persNombre}" eliminado y stock devuelto con éxito.`);
                } catch (err) {
                    console.error(err);
                    alert('Error al eliminar el personal.');
                }
            };

            const productosLibresDisponibles = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '');

            const productosFiltrados = productos.filter(item => 
                (item.producto && item.producto.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.personal_asignado && item.personal_asignado.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.categoria && item.categoria.toLowerCase().includes(busqueda.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(busqueda.toLowerCase()))
            );

            const totalUnidades = productos.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const unidadesSinAsignar = productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);
            const registrosAsignados = productos.filter(p => p.personal_asignado && p.personal_asignado.trim() !== '');

            const productosTotalesConsolidados = Object.values(
                productos.reduce((acc, curr) => {
                    const key = curr.sku || curr.producto;
                    if (!acc[key]) {
                        acc[key] = { sku: curr.sku, producto: curr.producto, categoria: curr.categoria, cantidad: 0 };
                    }
                    acc[key].cantidad += Number(curr.cantidad) || 0;
                    return acc;
                }, {})
            );

            const asignacionesConsolidadas = Object.values(
                registrosAsignados.reduce((acc, curr) => {
                    const key = curr.sku || curr.producto;
                    if (!acc[key]) {
                        acc[key] = { sku: curr.sku, producto: curr.producto, asignaciones: [] };
                    }
                    acc[key].asignaciones.push({ persona: curr.personal_asignado, cantidad: curr.cantidad });
                    return acc;
                }, {})
            );

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'} p-6 transition-colors duration-300`}>
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* Header personalizado con Cordero y Asociados */}
                        <header className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} p-6 rounded-2xl shadow-sm border flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-colors`}>
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className={`text-2xl font-black tracking-tight ${darkMode ? 'text-white' : 'text-slate-900'}`}>Cordero y Asociados</h1>
                                    <span className="bg-indigo-600 text-white text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-widest shadow-sm">PRO V2.0</span>
                                </div>
                                <p className={`text-sm mt-0.5 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Sistema de Inventario Modular</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`px-4 py-3 rounded-xl font-medium text-sm transition flex items-center gap-2 cursor-pointer border ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400 hover:bg-slate-700' : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'}`}
                                >
                                    <span>{darkMode ? '☀️ Modo Claro' : '🌙 Modo Oscuro'}</span>
                                </button>
                                <button 
                                    onClick={() => { setModalAbierto(true); setSeccionSeleccionada(null); }}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-md shadow-indigo-600/20 flex items-center gap-2 cursor-pointer"
                                >
                                    <span>📊</span> Ver Detalle de Oficina
                                </button>
                            </div>
                        </header>

                        {/* Pestañas de Navegación */}
                        <div className={`flex gap-2 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} p-2 rounded-2xl shadow-sm border transition-colors`}>
                            <button 
                                onClick={() => setTabActiva('asignar')}
                                className={`flex-1 py-3 px-4 rounded-xl font-medium text-sm transition cursor-pointer ${tabActiva === 'asignar' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                🔗 Asignar Productos
                            </button>
                            <button 
                                onClick={() => setTabActiva('productos')}
                                className={`flex-1 py-3 px-4 rounded-xl font-medium text-sm transition cursor-pointer ${tabActiva === 'productos' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                📦 Gestión de Productos
                            </button>
                            <button 
                                onClick={() => setTabActiva('personal')}
                                className={`flex-1 py-3 px-4 rounded-xl font-medium text-sm transition cursor-pointer ${tabActiva === 'personal' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : darkMode ? 'text-slate-400 hover:bg-slate-800 hover:text-slate-200' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                👥 Gestión de Personal
                            </button>
                        </div>

                        {/* APARTADO 1: ASIGNAR */}
                        {tabActiva === 'asignar' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-100 text-slate-800'} p-6 rounded-2xl shadow-sm border space-y-4 transition-colors`}>
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <span>🔗</span> Asignar Stock Disponible a Personal
                                </h2>
                                <form onSubmit={handleAsignar} className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Seleccionar Producto Libre</label>
                                        <select 
                                            value={formAsignacion.producto_id} 
                                            onChange={e => setFormAsignacion({...formAsignacion, producto_id: e.target.value})} 
                                            className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            required
                                        >
                                            <option value="">-- Elige un producto --</option>
                                            {productosLibresDisponibles.map(p => (
                                                <option key={p.id} value={p.id}>
                                                    {p.sku} - {p.producto} (Disponibles: {p.cantidad})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Seleccionar Personal</label>
                                        <select 
                                            value={formAsignacion.personal_nombre} 
                                            onChange={e => setFormAsignacion({...formAsignacion, personal_nombre: e.target.value})} 
                                            className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            required
                                        >
                                            <option value="">-- Elige al personal --</option>
                                            {personalList.map(pers => (
                                                <option key={pers.id} value={pers.nombre}>
                                                    {pers.nombre} ({pers.cargo || 'Sin cargo'})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad a Asignar</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            value={formAsignacion.cantidad_asignada} 
                                            onChange={e => setFormAsignacion({...formAsignacion, cantidad_asignada: e.target.value})} 
                                            className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                            required 
                                        />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl transition cursor-pointer shadow-md shadow-indigo-600/20">
                                            Confirmar Asignación
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* APARTADO 2: PRODUCTOS */}
                        {tabActiva === 'productos' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-100 text-slate-800'} p-6 rounded-2xl shadow-sm border space-y-4 transition-colors`}>
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <span>📦</span> Agregar Nuevo Producto al Inventario
                                </h2>
                                <form onSubmit={handleSaveProducto} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Código SKU (Automático)</label>
                                        <input type="text" value={generarSKU()} disabled className={`w-full border rounded-xl px-4 py-2.5 text-sm font-bold ${darkMode ? 'bg-slate-800 border-slate-700 text-indigo-400' : 'bg-slate-100 border-slate-200 text-slate-500'}`} />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Categoría</label>
                                        <input 
                                            type="text" 
                                            list="lista-categorias"
                                            placeholder="Elige o escribe categoría..." 
                                            value={formProducto.categoria} 
                                            onChange={e => setFormProducto({...formProducto, categoria: e.target.value})} 
                                            className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} 
                                            required 
                                        />
                                        <datalist id="lista-categorias">
                                            {categoriasUnicas.map((cat, idx) => (
                                                <option key={idx} value={cat} />
                                            ))}
                                        </datalist>
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre del Producto</label>
                                        <input type="text" placeholder="Ej. Laptop HP" value={formProducto.producto} onChange={e => setFormProducto({...formProducto, producto: e.target.value})} className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad Total</label>
                                        <input type="number" placeholder="Ej. 5" value={formProducto.cantidad} onChange={e => setFormProducto({...formProducto, cantidad: e.target.value})} className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} required />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Observaciones</label>
                                        <input type="text" placeholder="Ej. Stock principal" value={formProducto.observaciones} onChange={e => setFormProducto({...formProducto, observaciones: e.target.value})} className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} />
                                    </div>
                                    <div className="sm:col-span-2 flex justify-end items-end">
                                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-8 rounded-xl transition cursor-pointer shadow-md shadow-indigo-600/20">
                                            Guardar Producto
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* APARTADO 3: PERSONAL */}
                        {tabActiva === 'personal' && (
                            <section className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-100 text-slate-800'} p-6 rounded-2xl shadow-sm border space-y-4 transition-colors`}>
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <span>👥</span> Registrar Nuevo Personal
                                </h2>
                                <form onSubmit={handleSavePersonal} className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre Completo</label>
                                        <input type="text" placeholder="Ej. Leandro Zamora" value={formPersonal.nombre} onChange={e => setFormPersonal({...formPersonal, nombre: e.target.value})} className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} required />
                                    </div>
                                    <div>
                                        <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cargo</label>
                                        <input type="text" placeholder="Ej. Desarrollador" value={formPersonal.cargo} onChange={e => setFormPersonal({...formPersonal, cargo: e.target.value})} className={`w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`} />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl transition cursor-pointer shadow-md shadow-indigo-600/20">
                                            Guardar Personal
                                        </button>
                                    </div>
                                </form>
                            </section>
                        )}

                        {/* Listado General */}
                        <section className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} rounded-2xl shadow-sm border overflow-hidden transition-colors`}>
                            <div className={`p-6 border-b ${darkMode ? 'border-slate-800' : 'border-slate-100'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4`}>
                                <div>
                                    <h2 className={`text-lg font-semibold ${darkMode ? 'text-white' : 'text-slate-800'}`}>📦 Listado General de Inventario y Asignaciones</h2>
                                    <p className={`text-xs mt-0.5 ${darkMode ? 'text-slate-400' : 'text-slate-400'}`}>Control de existencias y asignaciones activas</p>
                                </div>
                                <div className="w-full sm:w-72">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 Buscar..." 
                                        value={busqueda} 
                                        onChange={e => setBusqueda(e.target.value)} 
                                        className={`w-full border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 ${darkMode ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-slate-50 border-slate-200'}`} 
                                    />
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className={`${darkMode ? 'bg-slate-950 text-slate-400 border-slate-800' : 'bg-slate-50 text-slate-400 border-slate-100'} text-xs uppercase tracking-wider border-b`}>
                                            <th className="p-4 font-semibold">SKU</th>
                                            <th className="p-4 font-semibold">Categoría</th>
                                            <th className="p-4 font-semibold">Producto</th>
                                            <th className="p-4 font-semibold">Cantidad</th>
                                            <th className="p-4 font-semibold">Personal Asignado</th>
                                            <th className="p-4 font-semibold">Observaciones</th>
                                            <th className="p-4 font-semibold text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className={`divide-y ${darkMode ? 'divide-slate-800 text-slate-300' : 'divide-slate-100 text-slate-700'} text-sm`}>
                                        {loading ? (
                                            <tr><td colSpan="7" className="p-8 text-center text-slate-400">Cargando registros...</td></tr>
                                        ) : productosFiltrados.length === 0 ? (
                                            <tr><td colSpan="7" className="p-8 text-center text-slate-400">No se encontraron productos.</td></tr>
                                        ) : (
                                            productosFiltrados.map((item) => (
                                                <tr key={item.id} className={`transition ${darkMode ? 'hover:bg-slate-800/50' : 'hover:bg-slate-50/50'}`}>
                                                    <td className={`p-4 font-medium ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>{item.sku}</td>
                                                    <td className={`p-4 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>{item.categoria}</td>
                                                    <td className={`p-4 font-semibold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{item.producto}</td>
                                                    <td className={`p-4 font-medium ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}>{item.cantidad}</td>
                                                    <td className="p-4">
                                                        {item.personal_asignado && item.personal_asignado.trim() !== '' ? (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                                                                {item.personal_asignado}
                                                            </span>
                                                        ) : (
                                                            <span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                                                Disponible (Sin asignar)
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className={`p-4 text-xs ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{item.observaciones || '-'}</td>
                                                    <td className="p-4 text-center space-x-2">
                                                        <button onClick={() => { setItemEditando(item); setCantidadOriginal(Number(item.cantidad)); }} className={`px-3 py-1.5 text-xs rounded-lg transition font-medium cursor-pointer ${darkMode ? 'bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 border border-indigo-500/20' : 'text-indigo-600 bg-indigo-50 hover:bg-indigo-100'}`}>
                                                            Editar
                                                        </button>
                                                        <button onClick={() => handleEliminarRegistro(item)} className={`px-3 py-1.5 text-xs rounded-lg transition font-medium cursor-pointer ${darkMode ? 'bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20' : 'text-rose-600 bg-rose-50 hover:bg-rose-100'}`}>
                                                            Eliminar
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        {/* Modal para Editar Fila de Producto */}
                        {itemEditando && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-100 text-slate-800'} rounded-2xl shadow-2xl border max-w-md w-full p-6 space-y-4`}>
                                    <h3 className="text-lg font-bold">✏️ Editar Registro de Inventario</h3>
                                    <form onSubmit={handleGuardarEdicion} className="space-y-4">
                                        <div>
                                            <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cantidad</label>
                                            <input type="number" min="1" value={itemEditando.cantidad} onChange={e => setItemEditando({...itemEditando, cantidad: e.target.value})} className={`w-full border rounded-xl px-4 py-2 text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-200'}`} required />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Personal Asignado</label>
                                            <input type="text" value={itemEditando.personal_asignado || ''} onChange={e => setItemEditando({...itemEditando, personal_asignado: e.target.value})} placeholder="Vacío si está libre" className={`w-full border rounded-xl px-4 py-2 text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-200'}`} />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Observaciones</label>
                                            <input type="text" value={itemEditando.observaciones || ''} onChange={e => setItemEditando({...itemEditando, observaciones: e.target.value})} className={`w-full border rounded-xl px-4 py-2 text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-200'}`} />
                                        </div>
                                        <div className="flex justify-end gap-2 pt-2">
                                            <button type="button" onClick={() => setItemEditando(null)} className={`px-4 py-2 text-sm rounded-xl cursor-pointer ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'text-slate-600 bg-slate-100'}`}>Cancelar</button>
                                            <button type="submit" className="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl cursor-pointer">Guardar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal para Editar Personal */}
                        {personalEditando && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-[9999]">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-100 text-slate-800'} rounded-2xl shadow-2xl border max-w-md w-full p-6 space-y-4`}>
                                    <h3 className="text-lg font-bold">✏️ Editar Datos del Personal</h3>
                                    <form onSubmit={handleGuardarPersonalEdicion} className="space-y-4">
                                        <div>
                                            <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Nombre Completo</label>
                                            <input type="text" value={personalEditando.nombre} onChange={e => setPersonalEditando({...personalEditando, nombre: e.target.value})} className={`w-full border rounded-xl px-4 py-2 text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-200'}`} required />
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-semibold mb-1 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>Cargo</label>
                                            <input type="text" value={personalEditando.cargo || ''} onChange={e => setPersonalEditando({...personalEditando, cargo: e.target.value})} placeholder="Ej. Desarrollador" className={`w-full border rounded-xl px-4 py-2 text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'border-slate-200'}`} />
                                        </div>
                                        <div className="flex justify-end gap-2 pt-2">
                                            <button type="button" onClick={() => setPersonalEditando(null)} className={`px-4 py-2 text-sm rounded-xl cursor-pointer ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'text-slate-600 bg-slate-100'}`}>Cancelar</button>
                                            <button type="submit" className="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl cursor-pointer">Guardar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal Detalle de Oficina */}
                        {modalAbierto && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-100 text-slate-800'} rounded-2xl shadow-2xl border max-w-2xl w-full p-6 space-y-6 max-h-[90vh] overflow-y-auto`}>
                                    <div className={`flex justify-between items-center border-b ${darkMode ? 'border-slate-800' : 'border-slate-100'} pb-4`}>
                                        <h3 className="text-lg font-bold flex items-center gap-2">
                                            <span>📋</span> Resumen Detallado de la Oficina
                                        </h3>
                                        <button onClick={() => { setModalAbierto(false); setSeccionSeleccionada(null); }} className={`text-sm font-bold px-3 py-1 rounded-lg cursor-pointer ${darkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-600'}`}>
                                            ✕ Cerrar
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div onClick={() => setSeccionSeleccionada('total')} className={`p-4 rounded-xl text-center cursor-pointer transition border ${seccionSeleccionada === 'total' ? (darkMode ? 'bg-indigo-950/60 border-indigo-500' : 'bg-indigo-100 border-indigo-400') : (darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-indigo-50 border-indigo-100')}`}>
                                            <span className={`block text-xs font-semibold uppercase mb-1 ${darkMode ? 'text-indigo-400' : 'text-indigo-500'}`}>Total Unidades Oficina</span>
                                            <span className={`text-2xl font-bold ${darkMode ? 'text-indigo-300' : 'text-indigo-700'}`}>{totalUnidades}</span>
                                        </div>
                                        <div onClick={() => setSeccionSeleccionada('libres')} className={`p-4 rounded-xl text-center cursor-pointer transition border ${seccionSeleccionada === 'libres' ? (darkMode ? 'bg-emerald-950/60 border-emerald-500' : 'bg-emerald-100 border-emerald-400') : (darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-emerald-50 border-emerald-100')}`}>
                                            <span className={`block text-xs font-semibold uppercase mb-1 ${darkMode ? 'text-emerald-400' : 'text-emerald-500'}`}>Unidades Libres</span>
                                            <span className={`text-2xl font-bold ${darkMode ? 'text-emerald-300' : 'text-emerald-700'}`}>{unidadesSinAsignar}</span>
                                        </div>
                                        <div onClick={() => setSeccionSeleccionada('personal')} className={`p-4 rounded-xl text-center cursor-pointer transition border ${seccionSeleccionada === 'personal' ? (darkMode ? 'bg-amber-950/60 border-amber-500' : 'bg-amber-100 border-amber-400') : (darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-amber-50 border-amber-100')}`}>
                                            <span className={`block text-xs font-semibold uppercase mb-1 ${darkMode ? 'text-amber-400' : 'text-amber-500'}`}>Total Personal</span>
                                            <span className={`text-2xl font-bold ${darkMode ? 'text-amber-300' : 'text-amber-700'}`}>{personalList.length}</span>
                                        </div>
                                        <div onClick={() => setSeccionSeleccionada('asignaciones')} className={`p-4 rounded-xl text-center cursor-pointer transition border ${seccionSeleccionada === 'asignaciones' ? (darkMode ? 'bg-purple-950/60 border-purple-500' : 'bg-purple-100 border-purple-400') : (darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-purple-50 border-purple-100')}`}>
                                            <span className={`block text-xs font-semibold uppercase mb-1 ${darkMode ? 'text-purple-400' : 'text-purple-500'}`}>Asignaciones Activas</span>
                                            <span className={`text-2xl font-bold ${darkMode ? 'text-purple-300' : 'text-purple-700'}`}>{registrosAsignados.length}</span>
                                        </div>
                                    </div>

                                    {seccionSeleccionada && (
                                        <div className={`${darkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'} border p-4 rounded-xl space-y-3`}>
                                            <h4 className={`font-bold text-sm uppercase ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>Detalle Seleccionado</h4>
                                            <div className="max-h-48 overflow-y-auto space-y-2">
                                                {seccionSeleccionada === 'personal' ? (
                                                    personalList.map(p => (
                                                        <div key={p.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} p-2.5 rounded-lg border flex justify-between items-center text-sm`}>
                                                            <span>👤 <strong>{p.nombre}</strong> <span className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-400'}`}>({p.cargo || 'Sin cargo'})</span></span>
                                                            <div className="space-x-3">
                                                                <button onClick={() => setPersonalEditando({...p, nombreAntiguo: p.nombre})} className="text-xs text-indigo-400 hover:underline cursor-pointer font-medium">Editar</button>
                                                                <button onClick={() => handleDeletePersonal(p.id, p.nombre)} className="text-xs text-rose-400 hover:underline cursor-pointer font-medium">Eliminar</button>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'total' ? (
                                                    productosTotalesConsolidados.map((item, idx) => (
                                                        <div key={idx} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200'} p-2.5 rounded-lg border text-sm flex justify-between items-center`}>
                                                            <span className="font-semibold">📦 {item.producto}</span>
                                                            <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${darkMode ? 'bg-indigo-950 text-indigo-400 border border-indigo-800' : 'bg-indigo-50 text-indigo-700'}`}>Total: {item.cantidad}</span>
                                                        </div>
                                                    ))
                                                ) : seccionSeleccionada === 'asignaciones' ? (
                                                    asignacionesConsolidadas.map((item, idx) => (
                                                        <div key={idx} className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} p-3 rounded-lg border text-sm space-y-2`}>
                                                            <div className={`font-bold border-b pb-1 ${darkMode ? 'text-purple-400 border-slate-800' : 'text-purple-700 border-slate-100'}`}>
                                                                🏷️ {item.producto} <span className="text-xs text-slate-500 font-normal">({item.sku})</span>
                                                            </div>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {item.asignaciones.map((asig, aIdx) => (
                                                                    <span key={aIdx} className={`inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium ${darkMode ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-amber-50 text-amber-800 border border-amber-200'}`}>
                                                                        👤 {asig.persona} (Cant: {asig.cantidad})
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    productos.filter(p => !p.personal_asignado || p.personal_asignado.trim() === '').map(item => (
                                                        <div key={item.id} className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200'} p-2.5 rounded-lg border text-sm flex justify-between items-center`}>
                                                            <span>🟢 {item.producto} (Disponibles: {item.cantidad})</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryApp />, document.getElementById('root'));
    </script>
</body>
</html>
